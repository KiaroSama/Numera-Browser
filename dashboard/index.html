<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Numera Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The pre-paint background, before WebAssembly or the app stylesheet exist.
         It has to be a token or the light theme leaves a dark page behind the
         app - the hardcoded value that used to live here could never follow a
         theme switch. Repeated from app.css on purpose: this must work with
         no JS at all, so it cannot read from the bundle. */
      :root { --boot-bg: #191d24; color-scheme: dark; }
      :root[data-theme="light"] { --boot-bg: #eef0f4; color-scheme: light; }
      html, body { margin: 0; background: var(--boot-bg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <link rel="stylesheet" href="/assets/app.css" />
    <div id="dashboard-startup-error" class="ps-root" hidden>
      <div class="ps-locked">
        <div class="ps-locked-card">
          <h1 role="alert">Numera Browser couldn't start</h1>
          <p>Try starting the dashboard again.</p>
          <button type="button" id="retry-dashboard" class="ps-btn ghost">Try again</button>
        </div>
      </div>
    </div>
    <script type="module">
      const root = document.getElementById("root");
      const error = document.getElementById("dashboard-startup-error");
      const retry = document.getElementById("retry-dashboard");
      let attempt = 0;

      async function mount() {
        retry.disabled = true;
        let started;
        try {
          const module = await import(`/assets/numera_dashboard.js?attempt=${attempt++}`);
          await module.default();
          started = module;
          module.start();
          root.hidden = false;
          if (!error.hidden) root.querySelector("button")?.focus();
          error.hidden = true;
        } catch (cause) {
          try {
            started?.shutdown();
          } catch (cleanup) {
            console.error("Numera dashboard startup cleanup failed", cleanup);
          }
          console.error("Numera dashboard startup failed", cause);
          root.hidden = true;
          error.hidden = false;
        } finally {
          retry.disabled = false;
          if (!error.hidden) retry.focus();
        }
      }

      retry.addEventListener("click", mount);
      await mount();
    </script>
  </body>
</html>
