<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The pre-paint background, before React or the app stylesheet exist.
         It has to be a token or the light theme leaves a dark page behind the
         app - the hardcoded value that used to live here could never follow a
         theme switch. Repeated from theme.js on purpose: this must work with
         no JS at all, so it cannot read from the bundle. */
      :root { --boot-bg: #0a0c11; color-scheme: dark; }
      :root[data-theme="light"] { --boot-bg: #eef0f4; color-scheme: light; }
      html, body { margin: 0; background: var(--boot-bg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
