[package]
name = "numera-xtask"
version = "0.36.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "../../LICENSE"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.clippy]
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"
