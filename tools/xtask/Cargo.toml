[package]
name = "numera-xtask"
version = "0.36.0"
edition = "2024"
rust-version = "1.99"
publish = false
license-file = "../../LICENSE"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
numera-core = { path = "../../engine-rust", default-features = false }
regex = "1.13.1"
serde_yaml = "0.9.34"
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"
syn = { version = "=2.0.119", features = ["full", "visit"] }

[dev-dependencies]
numera-core = { path = "../../engine-rust", default-features = false, features = ["test-support"] }

[lints.clippy]
unwrap_used = "deny"

[lints.rust]
unsafe_code = "forbid"
