version: 2

updates:
  - package-ecosystem: cargo
    directory: /engine-rust
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels: [dependencies, engine]

  - package-ecosystem: cargo
    directory: /dashboard
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels: [dependencies, dashboard]

  - package-ecosystem: cargo
    directory: /browser-page-rust
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels: [dependencies, browser]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels: [dependencies, desktop]

  - package-ecosystem: cargo
    directory: /tools/xtask
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels: [dependencies, ci]

  - package-ecosystem: cargo
    directory: /tools/xtask/lifecycle-tests
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels: [dependencies, desktop]

  - package-ecosystem: cargo
    directory: /tools/security-scan
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, container]
