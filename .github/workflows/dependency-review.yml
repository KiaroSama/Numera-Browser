name: Dependency verification

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Public pull-request dependency delta
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) && github.event.repository.private == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
          base-ref: main
          head-ref: ${{ github.sha }}

  audit:
    name: Every authoritative Rust advisory gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: tools/xtask
      - name: Install the pinned native advisory tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Compile bounded verification tooling
        run: cargo build --manifest-path tools/xtask/Cargo.toml --locked
      - name: Audit all product, UI, desktop and tooling lockfiles
        run: |
          cargo xtask ci owned --wall 180 --idle 90 -- cargo audit --file engine-rust/Cargo.lock
          cargo xtask ci owned --wall 180 --idle 90 -- cargo audit --file dashboard/Cargo.lock
          cargo xtask ci owned --wall 180 --idle 90 -- cargo audit --file desktop/src-tauri/Cargo.lock
          cargo xtask ci owned --wall 180 --idle 90 -- cargo audit --file tools/xtask/Cargo.lock
          cargo xtask ci owned --wall 180 --idle 90 -- cargo audit --file tools/xtask/lifecycle-tests/Cargo.lock
