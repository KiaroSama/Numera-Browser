# Dependabot opens the upgrade PRs; this reads the other direction - it fails a
# PR that *introduces* a dependency with a known advisory or a denied licence.
name: Dependency review

on: pull_request

permissions:
  contents: read

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
