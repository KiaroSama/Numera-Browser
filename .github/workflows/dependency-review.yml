# Dependabot opens the upgrade PRs; this reads the other direction - it fails a
# PR that *introduces* a dependency with a known advisory or a denied licence.
#
# Two jobs, because the good one does not run here. `dependency-review-action`
# needs the dependency-graph API, and on a *private* repository that API needs
# GitHub Advanced Security. Without it the action does not analyse anything and
# does not report a finding - it exits with "Dependency review is not supported
# on this repository", which is an account limitation. It was doing that on
# every pull request, so the check had been red since the day it was added and
# said nothing about the changes it was supposedly reviewing. A check that is
# always red is a check nobody reads.
#
# So: the real review runs where it can work, and an advisory audit covers this
# repository in the meantime. Make the repository public, or enable Advanced
# Security, and the first job starts running on its own.
name: Dependency review

on: pull_request

permissions:
  contents: read
  pull-requests: write   # comment-summary-in-pr needs it to post

jobs:
  review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.repository.visibility == 'public'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  audit:
    name: Advisory audit (no Advanced Security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.repository.visibility != 'public'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # `npm audit` and `pip-audit` read the same advisory data without needing
      # the dependency-graph API, so they work on a private repository. High and
      # above fails; anything lower is noise on a desktop app with no untrusted
      # network surface in its build.
      - name: Audit the dashboard dependencies
        run: npm --prefix dashboard ci && npm --prefix dashboard audit --audit-level=high

      - name: Audit the engine dependencies
        run: |
          python -m pip install --quiet pip-audit
          # Audit the resolved third-party requirements, not the unpublished
          # local distribution (pip-audit --strict rejects even editable locals).
          python -m pip install --quiet \
            "fastapi>=0.142.2" "uvicorn>=0.54.0" "playwright>=1.62.0,<1.63" \
            "cryptography>=50.0.2" "patchright>=1.63.0" \
            "camoufox[geoip]>=0.5.7" "cloakbrowser[geoip]>=0.5.12" \
            "pytest>=9.1.1" "pytest-timeout>=2.4.0" "httpx>=0.28.1"
          pip-audit --strict --progress-spinner=off
