name: Dependency verification

# Called once by full CI; npm's lockfile audit lives in dashboard.yml.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Public pull-request dependency delta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  audit:
    name: Python and Cargo advisory gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      HOOKMAKER_MAX_TEST_WORKERS: "2"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
      - name: Install actual engine extras and the strict audit tool
        run: python scripts/migration/run_owned.py --wall 300 --idle 90 -- python -m pip install -e "engine[api,launch,secure,desktop,dev]" pip-audit==2.10.1
      - name: Audit resolved Python dependencies without waiving collection failures
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- python -m pip_audit --strict --skip-editable --progress-spinner=off --timeout=15
      - name: Install the verified stable Cargo advisory tool
        run: python scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit both authoritative Cargo lockfiles
        run: |
          python scripts/migration/run_owned.py --wall 180 --idle 90 -- cargo audit --file engine-rust/Cargo.lock
          python scripts/migration/run_owned.py --wall 180 --idle 90 -- cargo audit --file desktop/src-tauri/Cargo.lock
