name: Native profile seam
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full native contracts or one isolated reviewed seam
        type: choice
        default: profiles
        options: [profiles, identity-script, browser-options, browser-admission, browser-resources, browser-ip, browser-hints, browser-cookies, browser-extensions, cookie-export]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  profile:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo build --manifest-path tools/xtask/Cargo.toml --locked
      - run: cargo xtask ci owned --wall 120 --idle 60 -- cargo fmt --manifest-path engine-rust/Cargo.toml --all --check
      - name: Compile the selected native seam before executing it
        env:
          NATIVE_SCOPE: ${{ inputs.scope }}
        run: cargo xtask ci owned --wall 900 --idle 300 -- cargo xtask ci seam "$NATIVE_SCOPE" build
        shell: bash
      - name: Require every case in the selected native seam
        env:
          NATIVE_SCOPE: ${{ inputs.scope }}
        run: cargo xtask ci owned --wall 900 --idle 300 -- cargo xtask ci seam "$NATIVE_SCOPE" test
        shell: bash
      - run: cargo xtask ci owned --wall 900 --idle 300 -- cargo clippy --manifest-path engine-rust/Cargo.toml --locked --features native-product,native-browser,test-support --all-targets -- -D warnings
