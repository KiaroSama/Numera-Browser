name: Migration profile seam

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Profile contracts or isolated identity script seam
        type: choice
        default: profiles
        options: [profiles, identity-script, browser-options, browser-admission, browser-resources, browser-ip]

permissions:
  contents: read

jobs:
  profile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Source prerequisites
        run: python -m pip install -e "engine[api,dev]" "fastapi==0.142.3" "starlette==1.7.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rust
      - name: Formatting
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- cargo fmt --manifest-path engine-rust/Cargo.toml --all --check
      - name: Identity script contract
        if: inputs.scope == 'identity-script'
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- cargo test --manifest-path engine-rust/Cargo.toml --locked --test init_script_parity -- --test-threads=1
      - name: Browser option contract
        if: inputs.scope == 'browser-options'
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- cargo test --manifest-path engine-rust/Cargo.toml --locked --test browser_options_parity -- --test-threads=1
      - name: Browser admission contract
        if: inputs.scope == 'browser-admission'
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- cargo test --manifest-path engine-rust/Cargo.toml --locked --test browser_admission_parity -- --test-threads=1
      - name: Browser resource contract
        if: inputs.scope == 'browser-resources'
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- cargo test --manifest-path engine-rust/Cargo.toml --locked --test browser_resources_parity -- --test-threads=1
      - name: Browser IP identity contract
        if: inputs.scope == 'browser-ip'
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- cargo test --manifest-path engine-rust/Cargo.toml --locked --test browser_ip_parity -- --test-threads=1
      - name: Profile HTTP contracts
        if: inputs.scope == 'profiles'
        run: >-
          python scripts/migration/run_owned.py --wall 600 --idle 120 --
          cargo test --manifest-path engine-rust/Cargo.toml --locked
          --test profile_write_parity --test http_fields_parity
          --test profile_application_parity --test dashboard_error_kinds
          --test profile_overview_parity --test profile_batch_parity
          --test profile_http_import_parity --test ready_parity
          --test session_ready_lifecycle --test session_registry_lifecycle
          --test profile_http_delete_parity --test profile_delete_owned_session
          --test browser_adapter_protocol --test init_script_parity --test browser_options_parity --test browser_admission_parity --test browser_resources_parity
          --no-fail-fast -- --test-threads=2
      - name: Native lint
        if: inputs.scope == 'profiles'
        run: python scripts/migration/run_owned.py --wall 600 --idle 120 -- cargo clippy --manifest-path engine-rust/Cargo.toml --locked --all-targets -- -D warnings
