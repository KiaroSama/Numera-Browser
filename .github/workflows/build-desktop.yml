name: Build owner-signed artifacts for review
on:
  workflow_call:
    inputs:
      trusted_sha:
        type: string
        required: true
    secrets:
      NUMERA_RELEASE_SIGNING_KEY:
        required: true
      NUMERA_CODE_SIGNING_PFX:
        required: true
      NUMERA_CODE_SIGNING_PASSWORD:
        required: true
permissions:
  contents: read
  actions: read
  checks: read
env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NUMERA_SIGNING_SCOPE: owner
  NUMERA_TRUSTED_SHA: ${{ inputs.trusted_sha }}
jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {platform: linux-x64, os: ubuntu-24.04}
          - {platform: windows-x64, os: windows-latest}
          - {platform: macos-arm64, os: macos-latest}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.trusted_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file patchelf
      - run: cargo build --manifest-path tools/xtask/Cargo.toml --locked
      - run: cargo xtask ci owned --wall 900 --idle 300 -- cargo install tauri-cli --version 2.12.4 --locked
      - run: cargo xtask ci owned --wall 900 --idle 300 -- cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Require the independent successful CodeQL verdict for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci codeql-verdict
      - run: cargo xtask ci owned --wall 1800 --idle 300 -- cargo xtask provision-resources "${{ runner.temp }}/manual-native-resources"
      - name: Build the actual native product and unsigned installers
        run: cargo xtask ci owned --wall 1800 --idle 300 -- cargo xtask build-product build/manual-product --resources "${{ runner.temp }}/manual-native-resources"
      - name: Sign the portable native product with pinned owner identities
        env:
          NUMERA_RELEASE_SIGNING_KEY: ${{ secrets.NUMERA_RELEASE_SIGNING_KEY }}
          NUMERA_CODE_SIGNING_PFX: ${{ secrets.NUMERA_CODE_SIGNING_PFX }}
          NUMERA_CODE_SIGNING_PASSWORD: ${{ secrets.NUMERA_CODE_SIGNING_PASSWORD }}
        run: cargo xtask ci owned --wall 900 --idle 300 -- cargo xtask ci product-sign build/manual-product "${{ matrix.platform }}"
      - name: Preserve signed archives and receipts for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: owner-signed-${{ matrix.platform }}-${{ github.sha }}
          path: |
            build/manual-product/numera-owner-signed-*.zip
            build/manual-product/owner-signed-*.json
            build/manual-product/owner-signed-*.sig
          if-no-files-found: error
          retention-days: 7
