name: Build distributions

# CI calls this once after its verification tiers. Dispatch CI for a manual build;
# an independent run would not own the verified dashboard artifact.
on:
  workflow_call:
    inputs:
      dashboard_artifact:
        type: string
        default: dashboard-dist
    outputs:
      source_sha:
        value: ${{ jobs.manifest.outputs.source_sha }}
      manifest_artifact:
        value: ${{ jobs.manifest.outputs.manifest_artifact }}

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HOOKMAKER_MAX_TEST_WORKERS: "2"
  CARGO_BUILD_JOBS: "2"

jobs:
  server:
    name: Server distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.dashboard_artifact }}
          path: dashboard/dist
      - name: Require the dashboard from this source SHA
        run: |
          python -I -c 'import json,os,pathlib; p=pathlib.Path("dashboard/dist/ci-source.json"); assert json.loads(p.read_text(encoding="utf-8"))["source_sha"]==os.environ["GITHUB_SHA"]; p.unlink()'
      - name: Install released build inputs
        timeout-minutes: 5
        run: python -m pip install -r scripts/build/requirements.txt "./engine[api,launch,secure,desktop]"
      - name: Stage dashboard and complete notices for the wheel
        run: |
          python scripts/build/distribution.py stage-wheel
          cp -R dashboard/dist engine/numera/web
      - name: Build the wheel and source distribution
        timeout-minutes: 5
        run: python scripts/migration/run_owned.py --wall 240 --idle 120 -- python -m build engine --outdir build/server/Numera\ Server
      - name: Verify and exercise the installed wheel
        timeout-minutes: 5
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- python scripts/build/server_smoke.py --directory "build/server/Numera Server"
      - name: Package matching complete source and checksum metadata
        run: python scripts/build/distribution.py package --stage "build/server/Numera Server" --platform server --output build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 3
        with:
          name: numera-release-server
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  desktop:
    name: Portable (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            architecture: x86_64
          - os: macos-latest
            platform: macos-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.dashboard_artifact }}
          path: dashboard/dist
      - name: Require exact dashboard SHA and host architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          python -I -c 'import json,os,pathlib,platform; p=pathlib.Path("dashboard/dist/ci-source.json"); assert json.loads(p.read_text(encoding="utf-8"))["source_sha"]==os.environ["GITHUB_SHA"]; assert platform.machine().lower()==os.environ["EXPECTED_ARCH"]; p.unlink()'
      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file
      - name: Install released build inputs
        timeout-minutes: 5
        run: python -m pip install -r scripts/build/requirements.txt "./engine[api,launch,secure,desktop]"
      - name: Verify Tauri shell formatting
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 60 --idle 30 -- cargo fmt --all --check
      - name: Compile and lint the Tauri shell
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Compile Tauri shell contract binaries
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo test --locked --all-features --no-run
      - name: Verify Tauri shell contracts
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 600 --idle 120 -- cargo test --locked --all-features -- --test-threads=2
      - name: Build the native shell without changing the application runtime
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo build --release --locked
      - name: Freeze the retained Python application
        timeout-minutes: 10
        run: |
          python scripts/migration/run_owned.py --wall 540 --idle 180 -- \
            python -m PyInstaller --noconfirm --clean --onedir --console --name numera-engine \
            --distpath desktop/dist/.build --workpath build/pyinstaller --specpath build \
            --add-data "dashboard/dist:numera/web" \
            --collect-all uvicorn --collect-submodules numera \
            --collect-all playwright --collect-all patchright --collect-all camoufox --collect-all cloakbrowser \
            --collect-all browserforge --collect-all apify_fingerprint_datapoints \
            --collect-all language_tags --collect-all ua_parser --collect-all screeninfo --collect-all maxminddb \
            --recursive-copy-metadata camoufox --recursive-copy-metadata cloakbrowser \
            --copy-metadata patchright --copy-metadata playwright scripts/engine_entry.py
      - name: Assemble the existing portable layout
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          stage="build/$PLATFORM/Numera Browser"
          mkdir -p "$stage"
          cp desktop/src-tauri/target/release/numera "$stage/numera"
          cp -R desktop/dist/.build/numera-engine "$stage/engine"
          cp docs/browser-notices.txt "$stage/BROWSER-NOTICES.txt"
          file "$stage/numera"
      - name: Prepare redistributable browsers (no Cloak binary)
        timeout-minutes: 15
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then python -m playwright install-deps chromium; fi
          python scripts/migration/run_owned.py --wall 840 --idle 180 -- python scripts/bundle-browsers.py \
            --output "$PWD/build/$PLATFORM/Numera Browser/browsers" --cache "$RUNNER_TEMP/numera-browser-downloads"
      - name: Exercise the assembled frozen product and settle all owned units
        timeout-minutes: 7
        env:
          PLATFORM: ${{ matrix.platform }}
        run: python scripts/migration/run_owned.py --wall 360 --idle 180 -- python scripts/build/smoke.py --stage "build/$PLATFORM/Numera Browser" --seconds 300
      - name: Package portable product with exact source and third-party provenance
        env:
          PLATFORM: ${{ matrix.platform }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/migration/run_owned.py --wall 600 --idle 180 -- python scripts/build/distribution.py package --stage "build/$PLATFORM/Numera Browser" --platform "$PLATFORM" --output build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 5
        with:
          name: numera-release-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  desktop-windows:
    name: Portable (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.dashboard_artifact }}
          path: dashboard/dist
      - name: Require exact dashboard SHA and host architecture
        shell: pwsh
        run: |
          python -I -c 'import json,os,pathlib,platform; p=pathlib.Path("dashboard/dist/ci-source.json"); assert json.loads(p.read_text(encoding="utf-8"))["source_sha"]==os.environ["GITHUB_SHA"]; assert platform.machine().lower() in {"amd64","x86_64"}; p.unlink()'
          if ($LASTEXITCODE) { throw 'Dashboard provenance/architecture validation failed' }
      - name: Install released build inputs
        timeout-minutes: 5
        run: python -m pip install -r scripts/build/requirements.txt "./engine[api,launch,secure,desktop]"
      - name: Verify Tauri shell formatting
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 60 --idle 30 -- cargo fmt --all --check
      - name: Compile and lint the Tauri shell
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Compile Tauri shell contract binaries
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo test --locked --all-features --no-run
      - name: Verify Tauri shell contracts
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 600 --idle 120 -- cargo test --locked --all-features -- --test-threads=2
      - name: Build the native shell with static CRT
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo build --release --locked
      - name: Build the existing portable product
        timeout-minutes: 20
        shell: pwsh
        run: python scripts/migration/run_owned.py --wall 1140 --idle 180 -- pwsh -NoProfile -NonInteractive -File scripts/build-desktop.ps1 -PrebuiltShell
      - name: Exercise the assembled frozen product and settle all owned units
        timeout-minutes: 7
        shell: pwsh
        run: python scripts/migration/run_owned.py --wall 360 --idle 180 -- python scripts/build/smoke.py --stage 'build/windows/Numera Browser' --seconds 300
      - name: Package portable product with exact source and third-party provenance
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/migration/run_owned.py --wall 600 --idle 180 -- python scripts/build/distribution.py package --stage 'build/windows/Numera Browser' --platform windows-x64 --output build/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 5
        with:
          name: numera-release-windows-x64
          path: build/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  manifest:
    name: Distribution manifest
    needs: [server, desktop, desktop-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.identity.outputs.source_sha }}
      manifest_artifact: distribution-manifest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: numera-release-windows-x64
          path: build/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: numera-release-linux-x64
          path: build/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: numera-release-macos-arm64
          path: build/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: numera-release-server
          path: build/release
      - name: Require all downloads and make the exact-source checksum manifest
        id: identity
        run: |
          python scripts/build/distribution.py manifest --directory build/release
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        timeout-minutes: 5
        with:
          name: distribution-manifest
          # Products already have immutable per-platform artifacts; do not store
          # another multi-gigabyte copy merely to publish the small manifest.
          path: |
            build/release/distribution.json
            build/release/SHA256SUMS
            build/release/numera-source-*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
