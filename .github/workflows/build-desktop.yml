# The builds that cannot happen on the maintainer's Windows machine.
#
# A Tauri binary links against the host's web view - WebKitGTK on Linux, WKWebView
# on macOS - so it cannot be cross-compiled. These runners are the only way the
# project produces a Linux or macOS desktop build at all.
#
# The server wheel is the opposite: pure Python, tagged py3-none-any, so one build
# runs everywhere. It is here for convenience and because installing it on Linux
# is the only real proof it works there.
name: Build (desktop + server)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  server:
    name: Server wheel (any OS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      # The engine serves numera/web, so the built dashboard has to be inside
      # the package before the wheel is made. Mirrors scripts/build-server.ps1.
      - name: Stage the dashboard into the package
        run: cp -r dashboard/dist engine/numera/web

      - name: Build wheel and sdist
        working-directory: engine
        run: python -m pip install --quiet build && python -m build --outdir ../build/server

      # A wheel tagged for one platform would install nowhere else, and the tag
      # is the only evidence either way.
      - name: Assert the wheel is platform-independent
        run: ls build/server/*py3-none-any.whl

      # Installing and starting it is the only proof the artifact actually works;
      # a wheel that builds and cannot serve is the failure worth catching.
      - name: Install it and check it serves
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet "$(ls build/server/*.whl)[api]"
          /tmp/v/bin/numera serve --port 8788 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8788/api/health && break || sleep 0.5
          done
          curl -sf http://127.0.0.1:8788/api/health
          curl -sf http://127.0.0.1:8788/ | grep -q Numera
          echo "server artifact serves both the API and the dashboard"

      - uses: actions/upload-artifact@v4
        with:
          name: numera-server-wheel
          path: build/server/*

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      # Tauri's Linux backend is WebKitGTK; without these the Rust build fails
      # at link time with missing pkg-config packages rather than anything that
      # names Tauri.
      - name: System dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                                  librsvg2-dev patchelf libssl-dev

      - name: Build the dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Freeze the engine
        run: |
          python -m pip install --quiet pyinstaller ".[api,launch]" --prefix /tmp/eng || true
          python -m pip install --quiet pyinstaller
          python -m pip install --quiet ./engine[api,launch]
          cp -r dashboard/dist engine/numera/web
          pyinstaller --noconfirm --name numera-engine --distpath desktop/dist/.build \
                      --collect-all uvicorn --collect-submodules numera \
                      engine/numera/__main__.py

      - name: Build the shell
        working-directory: desktop/src-tauri
        run: cargo build --release

      - name: Assemble the portable folder
        run: |
          plat=$([ "$RUNNER_OS" = "macOS" ] && echo macos || echo linux)
          echo "PLAT=$plat" >> "$GITHUB_ENV"
          mkdir -p "build/$plat/Numera"
          cp desktop/src-tauri/target/release/numera "build/$plat/Numera/numera"
          cp -r desktop/dist/.build/numera-engine "build/$plat/Numera/engine"
          du -sh "build/$plat/Numera"

      # Proof the binary is for the runner it was built on. A silently
      # mis-targeted artifact would upload happily and fail on a user's machine.
      - name: Check the binary matches the platform
        run: file "build/$PLAT/Numera/numera"

      - uses: actions/upload-artifact@v4
        with:
          name: numera-desktop-${{ runner.os }}
          path: build/${{ env.PLAT }}/Numera

  # Attach everything to the tag that triggered the run. This is how a build
  # reaches a user: the repository never carries one.
  release:
    name: Publish to the release
    needs: [server, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Zip each platform folder
        run: |
          cd artifacts
          for d in */; do zip -rq "../${d%/}.zip" "$d"; done
          ls -la ../*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          fail_on_unmatched_files: true
