# The builds that cannot happen on the maintainer's Windows machine.
#
# A Tauri binary links against the host's web view - WebKitGTK on Linux, WKWebView
# on macOS - so it cannot be cross-compiled. These runners are the only way the
# project produces a Linux or macOS desktop build at all.
#
# The server wheel is the opposite: pure Python, tagged py3-none-any, so one build
# runs everywhere. It is here for convenience and because installing it on Linux
# is the only real proof it works there.
name: Build (desktop + server)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  server:
    name: Server wheel (any OS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      # The engine serves numera/web, so the built dashboard has to be inside
      # the package before the wheel is made. Mirrors scripts/build-server.ps1.
      - name: Stage the dashboard into the package
        run: cp -r dashboard/dist engine/numera/web

      - name: Build wheel and sdist
        working-directory: engine
        run: python -m pip install --quiet build && python -m build --outdir ../build/server

      # A wheel tagged for one platform would install nowhere else, and the tag
      # is the only evidence either way.
      - name: Assert the wheel is platform-independent
        run: ls build/server/*py3-none-any.whl

      # Installing and starting it is the only proof the artifact actually works;
      # a wheel that builds and cannot serve is the failure worth catching.
      - name: Install it and check it serves
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet "$(ls build/server/*.whl)[api]"
          /tmp/v/bin/numera serve --port 8788 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8788/api/health && break || sleep 0.5
          done
          curl -sf http://127.0.0.1:8788/api/health
          curl -sf http://127.0.0.1:8788/ | grep -q Numera
          echo "server artifact serves both the API and the dashboard"

      - uses: actions/upload-artifact@v4
        with:
          name: numera-server-wheel
          path: build/server/*

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Same ceiling as the Windows job below, because it now does the same work:
    # a Chromium download and a real browser launch on top of the Rust build.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      # Tauri's Linux backend is WebKitGTK; without these the Rust build fails
      # at link time with missing pkg-config packages rather than anything that
      # names Tauri.
      - name: System dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                                  librsvg2-dev patchelf libssl-dev

      - name: Build the dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      # --add-data is what puts the dashboard in the bundle. --collect-submodules
      # collects Python modules and nothing else, so with it alone the frozen
      # engine served every API route and answered `/` with a 404 - a build that
      # passes a file listing, uploads happily, and opens to an empty window.
      # Mirrors scripts/build-desktop.ps1, which has always had it; the source
      # and destination are separated by `:` here and `;` there.
      - name: Freeze the engine
        run: |
          python -m pip install --quiet pyinstaller ".[api,launch,secure]" --prefix /tmp/eng || true
          python -m pip install --quiet pyinstaller
          python -m pip install --quiet ./engine[api,launch,secure]
          pyinstaller --noconfirm --name numera-engine --distpath desktop/dist/.build \
                      --add-data "dashboard/dist:numera/web" \
                      --collect-all uvicorn --collect-submodules numera \
                      engine/numera/__main__.py

      - name: Build the shell
        working-directory: desktop/src-tauri
        run: cargo build --release

      - name: Assemble the portable folder
        run: |
          plat=$([ "$RUNNER_OS" = "macOS" ] && echo macos || echo linux)
          echo "PLAT=$plat" >> "$GITHUB_ENV"
          mkdir -p "build/$plat/Numera Browser"
          cp desktop/src-tauri/target/release/numera "build/$plat/Numera Browser/numera"
          cp -r desktop/dist/.build/numera-engine "build/$plat/Numera Browser/engine"
          du -sh "build/$plat/Numera Browser"

      # `pip install playwright` installs the package, not the browser: that is a
      # separate download into a per-user cache. A release artifact lands on
      # machines that have never run Playwright, so without this the app starts,
      # serves the dashboard and fails at the first launch with "Executable
      # doesn't exist". Installed straight into the folder that gets uploaded,
      # which saves a copy: paths.use_bundled_browsers() looks for `browsers/`
      # beside the engine directory as well as inside it.
      - name: Bundle the Playwright browser
        run: |
          dest="$PWD/build/$PLAT/Numera Browser/browsers"
          if [ "$RUNNER_OS" = "Linux" ]; then
            # Chromium wants system libraries the WebKitGTK set above does not
            # cover, and that list changes with the runner image. --with-deps is
            # the only version of it anyone maintains; it is Debian/Ubuntu-only,
            # which is what the branch is for.
            PLAYWRIGHT_BROWSERS_PATH="$dest" python -m playwright install --with-deps chromium
          else
            PLAYWRIGHT_BROWSERS_PATH="$dest" python -m playwright install chromium
          fi
          # `playwright install chromium` also fetches `chromium_headless_shell`,
          # a few hundred MB this app never runs: drivers.py passes
          # channel="chromium" for headless precisely to avoid it, because the
          # shell cannot load extensions and announces itself as HeadlessChrome
          # over CDP. Same exclusion as the Windows build.
          rm -rf "$dest"/chromium_headless_shell-*
          du -sh "$dest"

      # Proof the binary is for the runner it was built on. A silently
      # mis-targeted artifact would upload happily and fail on a user's machine.
      - name: Check the binary matches the platform
        run: file "build/$PLAT/Numera Browser/numera"

      # A file listing is not a working app. The gate that matters: the
      # assembled folder has to start, create a profile, launch the *bundled*
      # Chromium and still have the profile after a restart. Freezing an engine
      # that cannot open a browser is the exact failure this catches, and it
      # looks like a successful build without it.
      - name: Smoke the assembled artifact
        run: bash scripts/smoke-portable.sh "build/$PLAT/Numera Browser"

      - uses: actions/upload-artifact@v4
        with:
          name: numera-desktop-${{ runner.os }}
          path: "build/${{ env.PLAT }}/Numera Browser"

  # Windows has its own script: it proves the static CRT took, which the POSIX
  # steps above have no equivalent of, and it is the same script a maintainer
  # runs locally. Bolting it into that matrix would mean reimplementing it in
  # bash. The browser bundle is the same on both, just expressed twice.
  desktop-windows:
    name: Desktop app (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # The point of running the script bare: `dashboard/dist` is git-ignored, so
      # a fresh checkout never has one, and the script used to abort on exactly
      # that. This job was therefore broken from a clean checkout for as long as
      # it existed. Asserting the absence keeps it honest - if someone adds an
      # `npm run build` step above, this fails and says why it should not be
      # needed.
      - name: There is no prebuilt dashboard (the script must make its own)
        shell: pwsh
        run: |
          if (Test-Path dashboard/dist) {
            throw "dashboard/dist exists before the build, so this job no longer proves the script works from a clean checkout"
          }

      - name: Build the portable app
        shell: pwsh
        run: ./scripts/build-desktop.ps1

      # The gate that matters: the assembled folder has to start, create a
      # profile, launch the *bundled* Chromium and still have the profile after
      # a restart. Freezing an engine that cannot open a browser is the exact
      # failure this catches, and it looks like a successful build without it.
      - name: Smoke the assembled artifact
        shell: pwsh
        run: ./scripts/smoke-portable.ps1 -Stage 'build/windows/Numera Browser'

      - uses: actions/upload-artifact@v4
        with:
          name: numera-desktop-Windows
          path: "build/windows/Numera Browser"

  # Attach everything to the tag that triggered the run. This is how a build
  # reaches a user: the repository never carries one.
  release:
    name: Publish to the release
    needs: [server, desktop, desktop-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Zip each platform folder
        run: |
          cd artifacts
          for d in */; do zip -rq "../${d%/}.zip" "$d"; done
          ls -la ../*.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          fail_on_unmatched_files: true
