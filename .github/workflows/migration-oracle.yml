name: Frozen contract and native seam
on:
  workflow_dispatch:
    inputs:
      seam:
        description: Verify the frozen characterization with its native contract
        type: choice
        required: true
        options: [http-fields, profile-write, profile-overview, profile-batch, profile-http-import, ready, profile-http-delete, init-script, browser-options, browser-admission, browser-resources, browser-ip, browser-hints, browser-startup]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      NATIVE_SEAM: ${{ inputs.seam }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - run: cargo build --manifest-path tools/xtask/Cargo.toml --locked
      - run: cargo xtask ci owned --wall 900 --idle 300 -- cargo xtask ci seam "$NATIVE_SEAM" test
      - name: Preserve immutable source-case mapping for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: frozen-native-contract-${{ inputs.seam }}-${{ github.sha }}
          path: |
            docs/rust-test-baseline.json
            docs/source-*-test-map.json
          if-no-files-found: error
