name: Migration source oracle

on:
  workflow_dispatch:
    inputs:
      seam:
        description: Original contract fixture to generate
        type: choice
        required: true
        options:
          - http-fields
          - profile-write
          - profile-overview
          - profile-batch
          - profile-http-import
          - ready
          - profile-http-delete
          - init-script
          - browser-options
          - browser-admission
          - browser-resources
          - browser-ip
          - browser-hints
          - browser-startup

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Original source prerequisites
        run: python -m pip install -e "engine[api,dev]" "fastapi==0.142.3" "starlette==1.7.0"
      - name: Generate non-sensitive original expectation
        env:
          ORACLE_SEAM: ${{ inputs.seam }}
        run: >-
          python scripts/migration/run_owned.py --wall 60 --idle 30 --
          python scripts/migration/oracle.py --seam "$ORACLE_SEAM"
          --output "$RUNNER_TEMP/fixture/$ORACLE_SEAM.json"
      - uses: actions/upload-artifact@v7
        with:
          name: source-expectation
          path: ${{ runner.temp }}/fixture/*.json
          if-no-files-found: error
          retention-days: 1
