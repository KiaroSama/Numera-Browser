name: CodeQL verification

# Full CI calls this once; independent push/PR triggers would duplicate scanning.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  checks: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        language: [actions, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the actual checkout and workflow subjects separately
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/numera-codeql-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/numera-codeql-evidence/checkout-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/numera-codeql-evidence/checkout-tree.txt"
          printf 'github.sha=%s\npr.head.sha=%s\npr.merge.sha=%s\nworkflow.sha=%s\ngithub.ref=%s\nevent=%s\nrepository=%s\nrun.id=%s\nrun.attempt=%s\n' "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_MERGE_SHA" "$WORKFLOW_SHA" "$GITHUB_REF" "$GITHUB_EVENT_NAME" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/numera-codeql-evidence/workflow-subjects.txt"
      - name: Initialize supported language analysis without duplicate builds
        id: init
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
          threads: 2
          db-location: ${{ runner.temp }}/numera-codeql-databases
          # Use the action's cgroup-aware RAM sizing, including its OS reserve.
      - name: Analyze the checkout and retain every result
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/numera-codeql-results
          # Repository default setup is disabled so this workflow uploads the
          # authoritative Rust SARIF verdict directly to Code Scanning.
          upload: always
          wait-for-processing: true
      - name: Record the actual CodeQL tool and resolved security suite
        if: always() && steps.init.outcome == 'success'
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          "$CODEQL" version --format=json > "$RUNNER_TEMP/numera-codeql-evidence/codeql-version.json"
          "$CODEQL" resolve queries --format=bylanguage "codeql/$LANGUAGE-queries:codeql-suites/$LANGUAGE-security-extended.qls" > "$RUNNER_TEMP/numera-codeql-evidence/resolved-security-queries.json"
      - name: Record evaluated queries and the complete SARIF digest
        if: always()
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          if [ -d "$RUNNER_TEMP/numera-codeql-databases/$LANGUAGE/results" ]; then
            find "$RUNNER_TEMP/numera-codeql-databases/$LANGUAGE/results" -type f -name '*.bqrs' -print | sort > "$RUNNER_TEMP/numera-codeql-evidence/evaluated-queries.txt"
          fi
          test -s "$RUNNER_TEMP/numera-codeql-results/$LANGUAGE.sarif"
          sha256sum "$RUNNER_TEMP/numera-codeql-results/$LANGUAGE.sarif" > "$RUNNER_TEMP/numera-codeql-evidence/sarif.sha256"
      - name: Preserve full findings, extraction diagnostics and source evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/numera-codeql-evidence
            ${{ runner.temp }}/numera-codeql-results
            ${{ runner.temp }}/numera-codeql-databases/${{ matrix.language }}/log
            ${{ runner.temp }}/numera-codeql-databases/${{ matrix.language }}/codeql-database.yml
            ${{ runner.temp }}/user-config.yaml
          if-no-files-found: error
          retention-days: 7

  verdict:
    name: Independent exact-source CodeQL verdict
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266
        with:
          workspaces: tools/xtask
      - name: Compile read-only native verdict tooling
        run: cargo build --manifest-path tools/xtask/Cargo.toml --locked
      - name: Require the independent analysis verdict before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask ci owned --wall 60 --idle 45 -- cargo xtask ci codeql-verdict
      - name: Retain the authenticated build and analysis source subjects
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-verdict-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/numera-codeql-verdict/source-subject.json
          if-no-files-found: warn
          retention-days: 7
