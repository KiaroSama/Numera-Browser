name: CodeQL verification

# Full CI calls this once; independent push/PR triggers would duplicate scanning.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  checks: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        language: [python, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize supported language analysis without duplicate builds
        uses: github/codeql-action/init@cee97f86b972a3ded3c58d04148362b193ddc518 # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          threads: 2
          ram: 4096
      - name: Analyze and upload the exact source revision
        uses: github/codeql-action/analyze@cee97f86b972a3ded3c58d04148362b193ddc518 # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          wait-for-processing: true

  verdict:
    name: Independent exact-source CodeQL verdict
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Require the independent analysis verdict before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/migration/run_owned.py --wall 60 --idle 45 -- python scripts/ci/codeql_gate.py
