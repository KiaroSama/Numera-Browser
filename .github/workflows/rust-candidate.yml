name: Rust candidate builds

# Supplement the full native product matrix with independent candidate builds.
# A successful candidate build is not full application acceptance.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
  CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  VSCMD_SKIP_SENDTELEMETRY: "1"

jobs:
  tooling:
    name: Rust build tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266
        with:
          workspaces: |
            engine-rust
            tools/xtask
      - name: Formatting
        run: cargo fmt --manifest-path tools/xtask/Cargo.toml --all --check
      - name: Native application and SDK formatting
        run: cargo fmt --manifest-path engine-rust/Cargo.toml --all --check
      - name: Strict lint
        run: cargo clippy --manifest-path tools/xtask/Cargo.toml --locked --all-targets -- -D warnings
      - name: Artifact identity and refusal contracts
        run: cargo test --manifest-path tools/xtask/Cargo.toml --locked --no-fail-fast
      - name: Compile and lint every native Rust test target
        run: cargo clippy --manifest-path engine-rust/Cargo.toml --locked --features native-browser,test-support --all-targets -- -D warnings
      - name: Offline Cloak and SDK protocol refusal and cleanup
        run: cargo test --manifest-path engine-rust/Cargo.toml --locked --features native-browser,test-support --test browser_adapter_protocol actual_sdk_adapter_stays_inert_before_open_and_cleans_protocol_failure -- --exact
      - name: Rust SDK registry ownership and shutdown
        run: cargo test --manifest-path engine-rust/Cargo.toml --locked --features native-browser,test-support --test browser_adapter_protocol registry_retains_sdk_transport_and_closes_only_its_admitted_session -- --exact
      - name: Browser identity policy and pinned model integrity
        run: cargo test --manifest-path engine-rust/Cargo.toml --locked --features native-browser --test browser_hints_parity

  build:
    name: Build Rust candidate (${{ matrix.platform }})
    # No needs: a test/coverage failure must not suppress compilation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
            arch: X64
          - platform: windows-arm64
            runner: windows-11-arm
            arch: ARM64
          - platform: linux-x64
            runner: ubuntu-24.04
            arch: X64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            arch: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266
        with:
          workspaces: |
            engine-rust
            tools/xtask
      - name: Verify native runner architecture
        shell: bash
        run: test "$RUNNER_ARCH" = "${{ matrix.arch }}"
      - name: Build, inspect and package the native application and SDK runtime
        id: candidate
        shell: bash
        # Bind the binaries and archive to the checked-out source commit.
        run: GITHUB_SHA="$CANDIDATE_SOURCE_SHA" cargo run --manifest-path tools/xtask/Cargo.toml --locked -- build-candidate build/rust-candidate
      - name: Build native product fixtures for Windows signing tests
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: GITHUB_SHA="$CANDIDATE_SOURCE_SHA" cargo build --manifest-path engine-rust/Cargo.toml --locked --release --no-default-features --features native-product,native-browser --bin numera-engine --bin numera-browser-runtime
      - name: Verify build tooling on the native host
        if: always()
        shell: bash
        run: GITHUB_SHA="$CANDIDATE_SOURCE_SHA" cargo test --manifest-path tools/xtask/Cargo.toml --locked --no-fail-fast
      - name: Preserve candidate, matching tracked source and checksums
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-candidate-${{ matrix.platform }}-${{ env.CANDIDATE_SOURCE_SHA }}
          path: build/rust-candidate/*
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required Rust builds
    if: ${{ !cancelled() }}
    needs: [tooling, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All native platforms and tooling passed
        env:
          TOOLING_RESULT: ${{ needs.tooling.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$TOOLING_RESULT" = success && test "$BUILD_RESULT" = success
