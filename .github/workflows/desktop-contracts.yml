name: Desktop production contracts

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HOOKMAKER_MAX_TEST_WORKERS: "2"
  CARGO_BUILD_JOBS: "2"

jobs:
  contracts:
    name: Shell contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri
      - name: Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file
      - name: Verify Tauri shell formatting
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 60 --idle 30 -- cargo fmt --all --check
      - name: Compile and lint the Tauri shell
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - name: Compile Tauri shell contract binaries
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo test --locked --no-default-features --no-run
      - name: Verify Tauri shell contracts
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 600 --idle 120 -- cargo test --locked --no-default-features -- --test-threads=2
