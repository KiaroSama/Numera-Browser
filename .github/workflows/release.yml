name: Publish verified build

# Only the trusted manual CI root calls this after its nonrecursive aggregate.
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      run_id:
        type: string
        required: true
    secrets:
      NUMERA_RELEASE_SIGNING_KEY:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: verified-release-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  gate:
    name: Require exact trusted verification
    if: github.event_name == 'workflow_dispatch' && github.actor == 'KiaroSama' && inputs.source_sha == github.sha && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/migration/native-runtime-checkpoint-20261012')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.gate.outputs.source_sha }}
      run_id: ${{ steps.gate.outputs.run_id }}
    steps:
      - name: Read the exact manual CI run and blocking aggregate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$RUN_ID" > run.json
          gh api --paginate "repos/$REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --slurp > jobs.json
          gh api "repos/$REPOSITORY/git/ref/heads/main" > main.json
          python3 -I - <<'PY'
          import json, os, pathlib
          run = json.loads(pathlib.Path('run.json').read_text(encoding='utf-8'))
          pages = json.loads(pathlib.Path('jobs.json').read_text(encoding='utf-8'))
          main = json.loads(pathlib.Path('main.json').read_text(encoding='utf-8'))
          assert run['name'] == 'CI' and run['path'] == '.github/workflows/ci.yml', 'Wrong verification workflow'
          assert run['id'] == int(os.environ['GITHUB_RUN_ID']) == int(os.environ['RUN_ID']), 'Different verification batch'
          assert os.environ['REPOSITORY'] == 'KiaroSama/Numera-Browser', 'Unapproved publication repository'
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Wrong verified source SHA'
          assert run['head_branch'] == os.environ['GITHUB_REF_NAME'] in ('main', 'migration/native-runtime-checkpoint-20261012'), 'Wrong verified ref'
          assert run['head_repository']['full_name'] == os.environ['REPOSITORY'], 'Untrusted verification repository'
          assert run['event'] == 'workflow_dispatch' and run['actor']['login'] == 'KiaroSama', 'Untrusted CI event'
          assert main['ref'] == 'refs/heads/main' and main['object']['type'] == 'commit', 'Wrong trusted publication ref'
          assert main['object']['sha'] == os.environ['SOURCE_SHA'], 'Main is not the exact verified source'
          required = [job for page in pages for job in page['jobs'] if job['name'] == 'Required verification']
          assert len(required) == 1 and required[0]['conclusion'] == 'success', 'Required verification did not pass'
          promoted = [job for page in pages for job in page['jobs'] if job['name'] == 'Promote exact verified source']
          assert len(promoted) == 1 and promoted[0]['conclusion'] == 'success', 'Verified source promotion did not pass'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"source_sha={os.environ['SOURCE_SHA']}\nrun_id={os.environ['RUN_ID']}\n")
          PY

  publish:
    name: Sign and publish exact verified downloads
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      RUN_ID: ${{ needs.gate.outputs.run_id }}
      REPOSITORY: ${{ github.repository }}
      PYTHONUTF8: "1"
      NUMERA_TRUSTED_SHA: ${{ inputs.source_sha }}
    steps:
      # Checked-out source is the exact reviewed main SHA, never artifact scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the declared signature verification prerequisite
        run: python scripts/migration/run_owned.py --wall 180 --idle 90 -- python -m pip install "engine[secure]"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution-manifest
          path: build/release
          run-id: ${{ needs.gate.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: numera-release-windows-x64
          path: build/release
          run-id: ${{ needs.gate.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: numera-release-linux-x64
          path: build/release
          run-id: ${{ needs.gate.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: numera-release-macos-arm64
          path: build/release
          run-id: ${{ needs.gate.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: numera-release-server
          path: build/release
          run-id: ${{ needs.gate.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          digest-mismatch: error
      - name: Authenticate the complete compatible generation manifest
        env:
          NUMERA_RELEASE_SIGNING_KEY: ${{ secrets.NUMERA_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          env -u NUMERA_RELEASE_SIGNING_KEY python scripts/migration/run_owned.py --wall 600 --idle 180 -- python scripts/build/signing.py manifest --directory build/release --destination build/release/update-manifest.json --generation "$RUN_ID" --source-sha "$SOURCE_SHA"
          python scripts/migration/run_owned.py --wall 120 --idle 60 -- python scripts/build/signing.py sign --manifest build/release/update-manifest.json --signature build/release/update-manifest.sig
          python scripts/migration/run_owned.py --wall 120 --idle 60 -- python scripts/build/signing.py verify --manifest build/release/update-manifest.json --signature build/release/update-manifest.sig
      - name: Reject unknown assets and bind publication to exact archive hashes
        run: |
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('build/release')
          sha = os.environ['SOURCE_SHA']
          manifest = json.loads((root/'distribution.json').read_text(encoding='utf-8'))
          assert manifest['source_sha'] == sha and manifest['application_runtime'] == 'retained-python'
          expected = {f'numera-windows-x64-{sha}.zip', f'numera-linux-x64-{sha}.tar.gz',
                      f'numera-macos-arm64-{sha}.tar.gz', f'numera-server-{sha}.tar.gz', f'numera-source-{sha}.tar.gz'}
          assert len(manifest['assets']) == 5 and {row['name'] for row in manifest['assets']} == expected, 'Missing/duplicate/unknown product asset'
          for platform in ('windows-x64','linux-x64','macos-arm64','server'):
              metadata_path = root/(platform+'.json')
              metadata = json.loads(metadata_path.read_text(encoding='utf-8'))
              assert metadata['source_sha'] == sha and metadata['signing_scope'] == 'owner', 'Unapproved signing scope'
              metadata_path.unlink()
          assert {path.name for path in root.iterdir()} == expected | {'distribution.json','SHA256SUMS','update-manifest.json','update-manifest.sig'}, 'Unexpected publication payload'
          checksums=[]
          for row in manifest['assets']:
              path=root/row['name']
              assert path.is_file() and not path.is_symlink()
              with path.open('rb') as stream: value=hashlib.file_digest(stream,'sha256').hexdigest()
              assert value == row['sha256'] and path.stat().st_size == row['size'], 'Asset checksum/size mismatch'
              checksums.append(f"{value}  {path.name}\n")
          assert (root/'SHA256SUMS').read_text(encoding='utf-8') == ''.join(checksums), 'Checksum file differs from manifest'
          PY
      - name: Recheck trusted main and publish immutable owner-signed generation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$actual" == "$SOURCE_SHA" ]] || { echo 'Main moved from the exact verified source; publication refused.'; exit 1; }
          tag="build-$SOURCE_SHA"
          if gh release view "$tag" --repo "$REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo 'This source SHA already has a release; immutable assets will not be replaced.'
            exit 1
          fi
          cat > release-notes.txt <<EOF
          Owner-signed Numera Browser generation $RUN_ID from $SOURCE_SHA.
          Exact manual verification: https://github.com/$REPOSITORY/actions/runs/$RUN_ID
          Updates require explicit user consent. The Ed25519 signed manifest binds complete
          Windows x64, Linux x64 and Apple Silicon portable downloads and SDK/browser versions.
          Windows/macOS native signatures use KiaroSama private/self-signed trust, not public
          certificate trust. macOS is not notarized; operating-system warnings can remain.
          The unfinished Rust application runtime is NOT promoted to default. Complete source,
          license and third-party notices accompany every download. Cloak binary is excluded.
          EOF
          mapfile -t assets < <(python3 -I -c 'import pathlib; print("\n".join(str(p) for p in sorted(pathlib.Path("build/release").iterdir())))')
          gh release create "$tag" "${assets[@]}" --repo "$REPOSITORY" --target "$SOURCE_SHA" --title "Verified build $SOURCE_SHA" --notes-file release-notes.txt --prerelease --latest=false
          gh api "repos/$REPOSITORY/git/ref/tags/$tag" --jq .object.sha | grep -Fx "$SOURCE_SHA"
          gh api "repos/$REPOSITORY/releases/tags/$tag" > published.json
          # Download the actual published metadata, not merely its API digest.
          # Existing assets are reused; no product build or full suite is repeated.
          gh release download "$tag" --repo "$REPOSITORY" --pattern update-manifest.json --pattern update-manifest.sig --dir "$RUNNER_TEMP/published-signature"
          python scripts/migration/run_owned.py --wall 120 --idle 60 -- python scripts/build/signing.py verify --manifest "$RUNNER_TEMP/published-signature/update-manifest.json" --signature "$RUNNER_TEMP/published-signature/update-manifest.sig"
          python3 -I - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('build/release')
          downloaded=pathlib.Path(os.environ['RUNNER_TEMP'])/'published-signature'
          for name in ('update-manifest.json','update-manifest.sig'):
              assert (downloaded/name).read_bytes()==(root/name).read_bytes(), 'Published signed metadata differs'
          release=json.loads(pathlib.Path('published.json').read_text(encoding='utf-8'))
          remote={row['name']:row for row in release['assets']}
          assert not release['draft'] and release['prerelease']
          assert set(remote)=={path.name for path in root.iterdir()}, 'Published assets differ'
          for path in root.iterdir():
              with path.open('rb') as stream: sha=hashlib.file_digest(stream,'sha256').hexdigest()
              assert remote[path.name]['digest']=='sha256:'+sha and remote[path.name]['size']==path.stat().st_size, 'Published asset checksum differs'
          PY
