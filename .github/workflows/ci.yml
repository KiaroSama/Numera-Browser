name: CI

# Manual checkpoint on GitHub-hosted runners. The owner temporarily prohibits
# local/self-hosted execution; dispatch does not start a runner on their machine.
# Keep release reuse and every required verification job.
on:
  workflow_dispatch:
  workflow_call:

# Read-only by default; nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported, plus the current default.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        working-directory: engine
        run: python -m pip install -e ".[api,dev]"
      - name: Compile check
        working-directory: engine
        run: python -m compileall -q numera
      - name: Unit tests
        working-directory: engine
        run: python ../scripts/migration/run_owned.py --wall 600 --idle 120 -- python -m pytest -q --ignore-glob=tests/test_*_live.py --durations=10

  engine-windows:
    # The storage locks are OS locks, and Windows takes an entirely different
    # path: `msvcrt.locking` rather than `fcntl.flock`, byte-range rather than
    # whole-file, and `os.replace` over a file another process has open is a
    # documented failure there. None of that was exercised by a Linux-only
    # matrix, so the cross-process tests only ever ran on the half of the code
    # that already worked.
    name: Engine tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        working-directory: engine
        run: python -m pip install -e ".[api,dev]"
      - name: Compile check
        working-directory: engine
        run: python -m compileall -q numera
      - name: Unit tests
        working-directory: engine
        run: python ../scripts/migration/run_owned.py --wall 600 --idle 120 -- python -m pytest -q --ignore-glob=tests/test_*_live.py --durations=10

  engine-live:
    name: Required live engine (${{ matrix.os }}, ${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        engine: [playwright, patchright, camoufox, cloak]
        include:
          - engine: playwright
            package: playwright==1.62.0
          - engine: patchright
            package: patchright==1.63.0
          - engine: camoufox
            package: camoufox[geoip]==0.5.7
          - engine: cloak
            package: cloakbrowser==0.5.12
    env:
      PYTHONUTF8: "1"
      NUMERA_TEST_ENGINE: ${{ matrix.engine }}
      # Explicit key-free official build; no paid/free-key fallback or login.
      # Internal CI use is permitted by CloakHQ's BINARY-LICENSE.md. This build
      # proves lifecycle behavior, not compatibility with newer licensed builds.
      CLOAKBROWSER_VERSION: "146.0.7680.177.5"
      CLOAKBROWSER_AUTO_UPDATE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install the selected engine and test dependencies
        timeout-minutes: 5
        run: python -m pip install -e "engine[api,dev]" "${{ matrix.package }}" "playwright==1.62.0"
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux' && matrix.engine != 'camoufox'
        timeout-minutes: 5
        run: python -m playwright install-deps chromium
      - name: Install Firefox system dependencies
        if: runner.os == 'Linux' && matrix.engine == 'camoufox'
        timeout-minutes: 5
        run: python -m playwright install-deps firefox
      - name: Install the selected Chromium browser
        if: matrix.engine == 'playwright' || matrix.engine == 'patchright'
        timeout-minutes: 10
        run: python -m ${{ matrix.engine }} install chromium
      - name: Install Camoufox browser and data
        if: matrix.engine == 'camoufox'
        timeout-minutes: 10
        run: python -m camoufox fetch
      - name: Fetch the pinned official Cloak binary
        if: matrix.engine == 'cloak'
        timeout-minutes: 10
        run: python scripts/live_engine.py prepare --engine cloak --fetch
      - name: Require the selected package and browser binary
        timeout-minutes: 2
        run: python scripts/live_engine.py prepare --engine ${{ matrix.engine }}
      - name: Required session-tree live tests
        timeout-minutes: 5
        working-directory: engine
        run: >-
          python ../scripts/migration/run_owned.py --wall 240 --idle 150 -- python -m pytest -q tests/test_session_tree_live.py
          -k "every_installed_engine or hard_killed_owner"
          --timeout=120 --timeout-method=thread --strict-config
          --junitxml=../build/live-engine/results.xml --durations=10
      - name: Reject missing or skipped engine coverage
        if: always()
        timeout-minutes: 1
        run: python scripts/live_engine.py report --engine ${{ matrix.engine }} --report build/live-engine/results.xml
      - name: Preserve the test report
        # On failure only. The report is diagnostic material - it is read when a
        # live engine breaks, never when it passes - and uploading it from every
        # green run spent an account-wide artifact quota that is exhausted, so
        # `Failed to CreateArtifact: Artifact storage quota has been hit` turned
        # four jobs whose tests had all passed into failures. The step that
        # actually enforces engine coverage is `Reject missing or skipped engine
        # coverage` above, which keeps `if: always()`; nothing here is softened.
        if: failure()
        uses: actions/upload-artifact@v7
        # No softening flag here, unlike the uploads in build-desktop.yml.
        # `test_live_engine_contract.py` asserts that no step of this job
        # carries one, by plain substring - so not even a comment may name it.
        # Every supported engine is *required* on both platforms, and the guard
        # keeps the whole job strict rather than trusting a reader to tell a
        # retention step from a verification one.
        with:
          name: live-engine-${{ matrix.os }}-${{ matrix.engine }}
          path: |
            build/live-engine/results.xml
            build/live-engine/logs/*.log
          if-no-files-found: warn
          retention-days: 7

  browser:
    name: Live browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine with the launcher
        working-directory: engine
        run: python -m pip install -e ".[api,launch,dev]"
      - name: Install Chromium
        working-directory: engine
        run: python -m playwright install --with-deps chromium
      # Proves the flags actually take effect in the browser - the unit tests
      # can pass while Chromium quietly ignores what we asked for. Globbed so a
      # new *_live.py cannot silently go unrun: the jobs above install no
      # browser, so these skip everywhere except here.
      - name: Browser-backed tests
        working-directory: engine
        run: python ../scripts/migration/run_owned.py --wall 900 --idle 150 -- python -m pytest -q tests/test_*_live.py --durations=10

  # The shell is half the product and nothing here compiled it. A Rust error
  # only showed up in the release build, which runs on a tag - by then the
  # version is cut.
  rust:
    name: Tauri shell (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri's Linux backend is WebKitGTK; without these the build fails at
      # link time with missing pkg-config packages rather than anything that
      # names Tauri.
      - name: System dependencies
        run: |
          set -euo pipefail
          packages=(libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev)
          missing=()
          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -qx 'install ok installed'; then
              missing+=("$package")
            fi
          done
          # A prepared self-hosted runner needs no unrelated apt repository refresh.
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Explicit, and the same version the dashboard job pins. This step used
      # the runner's ambient Node, so the Rust job's dashboard build ran on
      # whatever the image happened to ship - a different toolchain from the
      # one that actually gates the dashboard, and one that changes under us
      # when the image is updated.
      - uses: actions/setup-node@v7
        with:
          # Use current stable Node; jsdom's runtime floor is stricter than Vite's.
          node-version: "26"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # The shell reads the dashboard from a directory Tauri expects to exist.
      - name: Build the dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all --check

      - name: Lint
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: desktop/src-tauri
        run: python ../../scripts/migration/run_owned.py --wall 600 --idle 120 -- cargo test --all-features -- --test-threads=2

  rust-core:
    name: Rust migration core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          # The original behavior/catalog fixtures were recorded on this exact
          # interpreter. Keep Unicode classification drift visible, not hidden
          # by normalizing fixtures against a newer runtime.
          python-version: "3.13.15"
      - name: Source oracle prerequisites
        # Original HTTP behavior includes framework-level CORS/body contracts.
        # Pin the recorded oracle framework, not an arbitrary future release.
        run: python -m pip install -e "engine[api,dev]" "fastapi==0.142.3" "starlette==1.7.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rust
      - name: Source inventory and oracle drift
        run: python scripts/migration/run_owned.py --wall 180 --idle 90 -- python scripts/migration/verify_oracles.py
      - name: Native formatting
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- cargo fmt --manifest-path engine-rust/Cargo.toml --all --check
      - name: Native lint
        run: python scripts/migration/run_owned.py --wall 600 --idle 120 -- cargo clippy --manifest-path engine-rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Native parity seams
        run: python scripts/migration/run_owned.py --wall 600 --idle 120 -- cargo test --manifest-path engine-rust/Cargo.toml --locked --all-targets -- --test-threads=2
      - name: Original runtime remains selected
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/migration/verify_default.py

  docker:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Plain `docker build`, no buildx actions and no registry cache: the
      # runner has Docker, the image is not published from here, and the point
      # is to find out whether the Dockerfile still describes something that
      # works. Most of the time is the Playwright base image, which is the same
      # download a developer pays once.
      - name: Build the image
        run: docker build --pull --no-cache -t numera-browser:ci .

      # Building proves the Dockerfile parses and `pip install ./engine[...]`
      # resolves. It does not prove the container serves anything - and the
      # engine it installs changes on nearly every commit, which is exactly the
      # part a build alone would not catch.
      - name: The container serves, authenticates and stores
        run: |
          set -euo pipefail
          token="ci-$RANDOM"
          docker run -d --name numera-ci -e NUMERA_API_TOKEN="$token" \
                     -p 18787:8787 numera-browser:ci

          ready=""
          for _ in $(seq 1 60); do
            if curl -sf --max-time 3 -H "Authorization: Bearer $token" \
                    http://127.0.0.1:18787/api/health -o /tmp/health.json; then
              ready=1; break
            fi
            docker inspect -f '{{.State.Running}}' numera-ci | grep -q true || break
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "the container never answered /api/health"; docker logs numera-ci; exit 1
          fi
          echo "health: $(cat /tmp/health.json)"

          # The bind refuses 0.0.0.0 without a token by design, so an
          # unauthenticated request must be refused rather than served.
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                       http://127.0.0.1:18787/api/health)"
          [ "$code" = "401" ] || { echo "unauthenticated request got $code, not 401"; exit 1; }

          # And it can actually write: a profile through the real API.
          curl -sf --max-time 10 -X POST -H "Authorization: Bearer $token" \
               -H "Content-Type: application/json" -d '{"name":"ci-smoke"}' \
               http://127.0.0.1:18787/api/profiles > /dev/null
          curl -sf --max-time 10 -H "Authorization: Bearer $token" \
               http://127.0.0.1:18787/api/profiles | grep -q ci-smoke \
            || { echo "the profile it reported creating is not in the list"; exit 1; }

          # The vault backend has to be inside the image; `cryptography` lives
          # in the `secure` extra and a container cannot be told to pip-install
          # into itself.
          docker run --rm --entrypoint python numera-browser:ci \
                 -c "import cryptography, numera; print(numera.__version__, cryptography.__version__)"

      # API readiness cannot prove the browser bundled in the final image
      # matches its installed client. No host cache, network or root override.
      - name: The container launches its bundled Chromium
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s \
            docker run --rm --init --network none --shm-size=1g -i \
              --name "numera-browser-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --entrypoint python numera-browser:ci - \
              < scripts/smoke_container_browser.py

      - name: Remove an interrupted browser smoke container
        if: always()
        run: |
          docker rm -f "numera-browser-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" 2>/dev/null || true

      - name: Container logs on failure
        if: failure()
        run: docker logs numera-ci || true

      - name: Stop the container
        if: always()
        run: docker rm -f numera-ci || true

  dashboard:
    uses: ./.github/workflows/dashboard.yml

  required:
    name: Required verification
    if: always()
    needs: [engine, engine-windows, engine-live, browser, rust, rust-core, docker, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"]
          if failed:
              raise SystemExit("Required verification failed: " + ", ".join(failed))
          print("All required verification jobs passed")
          PY
