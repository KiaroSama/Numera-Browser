name: CI

# One hosted batch owns verification and the distributions consumed by release.
# Narrow migration/dashboard dispatches are maintenance tools, not release evidence.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Read-only by default; code scanning alone receives its upload permission.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  HOOKMAKER_MAX_TEST_WORKERS: "2"
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  coverage:
    name: Maintained suite coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Workflow parser prerequisite
        run: python scripts/migration/run_owned.py --wall 120 --idle 60 -- python -m pip install PyYAML==6.0.3
      - name: Fail on missing tiers, duplicate keys, non-UTF8 text or softened jobs
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/ci/suites.py coverage
      - name: Obtain the checksum-verified official workflow validator
        timeout-minutes: 2
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir "$directory"
          curl --fail --location --connect-timeout 10 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$directory/download.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $directory/download.tar.gz" | sha256sum --check --strict
          tar -xzf "$directory/download.tar.gz" -C "$directory" actionlint
      - name: Validate every workflow with native schema and expression checks
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- "$RUNNER_TEMP/actionlint-1.7.12/actionlint" -shellcheck= -pyflakes=

  secrets:
    name: Redacted tracked-content and history secret gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Obtain the checksum-verified official scanner
        timeout-minutes: 2
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir "$directory"
          curl --fail --location --connect-timeout 10 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$directory/download.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $directory/download.tar.gz" | sha256sum --check --strict
          tar -xzf "$directory/download.tar.gz" -C "$directory" gitleaks
          curl --fail --location --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/gitleaks/gitleaks/v8.30.1/config/gitleaks.toml \
            --output "$directory/official.toml"
      - name: Require official scanner rules without inherited tracked-path omissions
        run: >-
          python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/ci/suites.py secret-config
          --base "$RUNNER_TEMP/gitleaks-8.30.1/official.toml" --destination "$RUNNER_TEMP/gitleaks-8.30.1/strict.toml"
      - name: Stage only the exact tracked publication scope
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/ci/suites.py stage-tracked --destination "$RUNNER_TEMP/numera-tracked-scan"
      - name: Reject tracked-content secrets with exact reviewed fixture exceptions
        run: >-
          python scripts/migration/run_owned.py --wall 300 --idle 120 --
          "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" dir "$RUNNER_TEMP/numera-tracked-scan"
          --config "$RUNNER_TEMP/gitleaks-8.30.1/strict.toml" --redact=100 --ignore-gitleaks-allow
          --gitleaks-ignore-path "$RUNNER_TEMP/no-secret-exclusions" --timeout 240 --no-banner
      - name: Reject secrets in all fetched branch and tag history
        run: >-
          python scripts/migration/run_owned.py --wall 300 --idle 120 --
          "$RUNNER_TEMP/gitleaks-8.30.1/gitleaks" git . --log-opts=--all
          --config "$RUNNER_TEMP/gitleaks-8.30.1/strict.toml" --redact=100 --ignore-gitleaks-allow
          --gitleaks-ignore-path "$RUNNER_TEMP/no-secret-exclusions" --timeout 240 --no-banner

  dashboard:
    uses: ./.github/workflows/dashboard.yml

  engine:
    name: Engine tests (Linux py${{ matrix.python-version }})
    needs: [coverage, dashboard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
      - name: Install engine and compose parser
        run: python scripts/migration/run_owned.py --wall 300 --idle 90 -- python -m pip install -e "engine[api,dev]" PyYAML==6.0.3
      - name: Compile check
        run: python scripts/migration/run_owned.py --wall 120 --idle 60 -- python -m compileall -q engine/numera
      - name: Unit tests
        working-directory: engine
        run: python ../scripts/migration/run_owned.py --wall 600 --idle 120 -- python -m pytest -q --ignore-glob=tests/test_*_live.py --junitxml=../build/source-results.xml --durations=10
      - name: Reject missing suites and prerequisite skips
        if: always()
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/ci/suites.py report --tier python --report build/source-results.xml

  engine-windows:
    name: Engine tests (Windows)
    needs: [coverage, dashboard]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
      - name: Install engine and compose parser
        run: python scripts/migration/run_owned.py --wall 300 --idle 90 -- python -m pip install -e "engine[api,dev]" PyYAML==6.0.3
      - name: Compile check
        run: python scripts/migration/run_owned.py --wall 120 --idle 60 -- python -m compileall -q engine/numera
      - name: Unit tests
        working-directory: engine
        run: python ../scripts/migration/run_owned.py --wall 600 --idle 120 -- python -m pytest -q --ignore-glob=tests/test_*_live.py --junitxml=../build/source-results.xml --durations=10
      - name: Reject missing suites and prerequisite skips
        if: always()
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/ci/suites.py report --tier python --report build/source-results.xml

  engine-macos:
    # Source runtime uses bounded ps-based ownership on macOS. This is not
    # acceptance of the Rust candidate's unsupported macOS tree observer.
    name: Engine tests (macOS arm64, original runtime)
    needs: [coverage, dashboard]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-dist
          path: dashboard/dist
      - name: Install engine and compose parser
        run: python scripts/migration/run_owned.py --wall 300 --idle 90 -- python -m pip install -e "engine[api,dev]" PyYAML==6.0.3
      - name: Compile check
        run: python scripts/migration/run_owned.py --wall 120 --idle 60 -- python -m compileall -q engine/numera
      - name: Unit tests
        working-directory: engine
        run: python ../scripts/migration/run_owned.py --wall 600 --idle 120 -- python -m pytest -q --ignore-glob=tests/test_*_live.py --junitxml=../build/source-results.xml --durations=10
      - name: Reject missing suites and prerequisite skips
        if: always()
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/ci/suites.py report --tier python --report build/source-results.xml

  engine-live:
    name: Required live source and native SDK (${{ matrix.os }}, ${{ matrix.engine }})
    needs: coverage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        engine: [playwright, patchright, camoufox, cloak]
        include:
          - engine: playwright
            package: playwright==1.62.0
          - engine: patchright
            package: patchright==1.63.0
          - engine: camoufox
            package: camoufox[geoip]==0.5.7
          - engine: cloak
            package: cloakbrowser==0.5.12
    env:
      NUMERA_TEST_ENGINE: ${{ matrix.engine }}
      NUMERA_NATIVE_LIVE_ENGINE: ${{ matrix.engine }}
      # Internal key-free build only; never redistributed with a release.
      CLOAKBROWSER_VERSION: "146.0.7680.177.5"
      CLOAKBROWSER_AUTO_UPDATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Keep the recorded source oracle's interpreter and framework pins.
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: engine-rust
      - name: Install selected SDK and pinned source prerequisites
        run: python scripts/migration/run_owned.py --wall 300 --idle 90 -- python -m pip install -e "engine[api,dev]" "${{ matrix.package }}" "playwright==1.62.0" "fastapi==0.142.3" "starlette==1.7.0"
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux' && matrix.engine != 'camoufox'
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- python -m playwright install-deps chromium
      - name: Install Firefox system dependencies
        if: runner.os == 'Linux' && matrix.engine == 'camoufox'
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- python -m playwright install-deps firefox
      - name: Install selected Chromium
        if: matrix.engine == 'playwright' || matrix.engine == 'patchright'
        run: python scripts/migration/run_owned.py --wall 600 --idle 120 -- python -m ${{ matrix.engine }} install chromium
      - name: Install Camoufox browser and data
        if: matrix.engine == 'camoufox'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- python -m camoufox fetch
      - name: Fetch pinned official Cloak binary
        if: matrix.engine == 'cloak'
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- python scripts/live_engine.py prepare --engine cloak --fetch
      - name: Require selected package and browser binary
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/live_engine.py prepare --engine ${{ matrix.engine }}
      - name: Compile real SDK integration separately
        run: python scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo test --manifest-path engine-rust/Cargo.toml --locked --test browser_adapter_live --no-run
      - name: Required source session-tree live tests
        working-directory: engine
        run: >-
          python ../scripts/migration/run_owned.py --wall 240 --idle 150 -- python -m pytest -q tests/test_session_tree_live.py
          -k "every_installed_engine or hard_killed_owner"
          --timeout=120 --timeout-method=thread --strict-config
          --junitxml=../build/live-engine/results.xml --durations=10
      - name: Reject missing or skipped selected source coverage
        if: always()
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/live_engine.py report --engine ${{ matrix.engine }} --report build/live-engine/results.xml
      - name: Required native SDK context and cleanup
        run: >-
          python scripts/migration/run_owned.py --wall 600 --idle 150 --
          cargo test --manifest-path engine-rust/Cargo.toml --locked
          --test browser_adapter_live -- --ignored --test-threads=1 --nocapture
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-engine-${{ matrix.os }}-${{ matrix.engine }}
          path: |
            build/live-engine/results.xml
            build/live-engine/logs/*.log
            scripts/logs/*.log
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Remaining browser-backed source contracts (Linux)
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine launcher and test prerequisites
        run: python scripts/migration/run_owned.py --wall 300 --idle 90 -- python -m pip install -e "engine[api,launch,dev]" "playwright==1.62.0"
      - name: Install Chromium and system dependencies
        run: python scripts/migration/run_owned.py --wall 600 --idle 120 -- python -m playwright install --with-deps chromium
      - name: Require Chromium before suite collection
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/live_engine.py prepare --engine playwright
      - name: Browser-backed tests, excluding only matrix-owned cases
        working-directory: engine
        run: >-
          python ../scripts/migration/run_owned.py --wall 900 --idle 150 -- xvfb-run -a
          python -m pytest -q tests/test_*_live.py
          --deselect=tests/test_session_tree_live.py::test_every_installed_engine_gets_a_tree_of_its_own
          --deselect=tests/test_session_tree_live.py::test_hard_killed_owner_releases_only_an_empty_real_browser_tree
          --junitxml=../build/browser-results.xml --durations=10
      - name: Reject missing browser suites and prerequisite skips
        if: always()
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/ci/suites.py report --tier browser --report build/browser-results.xml

  rust-core:
    name: Native candidate contracts (${{ matrix.os }}; not selected)
    needs: coverage
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Pinned source oracle prerequisites
        run: python scripts/migration/run_owned.py --wall 300 --idle 90 -- python -m pip install -e "engine[api,dev]" "fastapi==0.142.3" "starlette==1.7.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: engine-rust
      - name: Source inventory and oracle drift
        run: python scripts/migration/run_owned.py --wall 180 --idle 90 -- python scripts/migration/verify_oracles.py
      - name: Native formatting
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- cargo fmt --manifest-path engine-rust/Cargo.toml --all --check
      - name: Compile all discovered non-live native suites separately
        run: python scripts/migration/run_owned.py --wall 900 --idle 300 -- python scripts/ci/suites.py native --phase build
      - name: Native strict lint
        run: python scripts/migration/run_owned.py --wall 600 --idle 120 -- cargo clippy --manifest-path engine-rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build acceptance-only native entry once before public handoff tests
        run: python scripts/migration/run_owned.py --wall 900 --idle 300 -- cargo build --manifest-path engine-rust/Cargo.toml --locked --example native_candidate
      - name: Bind native handoff tests to the actual candidate
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          name = "native_candidate.exe" if os.name == "nt" else "native_candidate"
          candidate = (Path("engine-rust/target/debug/examples") / name).resolve(strict=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"NUMERA_NATIVE_CANDIDATE={candidate}\n")
          PY
      - name: Every discovered native non-live suite and library test
        run: python scripts/migration/run_owned.py --wall 600 --idle 120 -- python scripts/ci/suites.py native --phase test
      - name: Native documentation tests
        run: python scripts/migration/run_owned.py --wall 120 --idle 60 -- cargo test --manifest-path engine-rust/Cargo.toml --locked --doc
      - name: Actual native CLI and MCP parity
        shell: bash
        run: |
          candidate=engine-rust/target/debug/examples/native_candidate
          if [[ "$RUNNER_OS" == Windows ]]; then candidate="$candidate.exe"; fi
          python scripts/migration/run_owned.py --wall 180 --idle 90 -- python scripts/migration/native_entry_acceptance.py --candidate "$candidate"
      - name: Actual native HTTP parity
        shell: bash
        run: |
          candidate=engine-rust/target/debug/examples/native_candidate
          if [[ "$RUNNER_OS" == Windows ]]; then candidate="$candidate.exe"; fi
          python scripts/migration/run_owned.py --wall 180 --idle 90 -- python scripts/migration/native_http_acceptance.py --candidate "$candidate"
      - name: Native server parent-death acceptance
        shell: bash
        run: |
          candidate=engine-rust/target/debug/examples/native_candidate
          if [[ "$RUNNER_OS" == Windows ]]; then candidate="$candidate.exe"; fi
          python scripts/migration/run_owned.py --wall 180 --idle 90 -- python scripts/migration/native_parent_acceptance.py --candidate "$candidate"
      - name: Windows hidden console acceptance
        if: runner.os == 'Windows'
        run: python scripts/migration/run_owned.py --wall 180 --idle 90 -- python scripts/migration/native_console_acceptance.py --candidate engine-rust/target/debug/examples/native_candidate.exe
      - name: Linux terminal password acceptance
        if: runner.os == 'Linux'
        run: python scripts/migration/run_owned.py --wall 180 --idle 90 -- python scripts/migration/native_tty_acceptance.py --candidate engine-rust/target/debug/examples/native_candidate
      - name: Linux detached ownership acceptance
        if: runner.os == 'Linux'
        run: python scripts/migration/run_owned.py --wall 180 --idle 90 -- python scripts/migration/native_job_acceptance.py --candidate engine-rust/target/debug/examples/native_candidate
      - name: Linux MCP signal and nested cleanup acceptance
        if: runner.os == 'Linux'
        run: python scripts/migration/run_owned.py --wall 180 --idle 90 -- python scripts/migration/native_signal_acceptance.py --candidate engine-rust/target/debug/examples/native_candidate
      - name: Original runtime remains selected
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/migration/verify_default.py

  docker:
    name: Container image and bundled-browser integration
    needs: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Build the image
        run: python scripts/migration/run_owned.py --wall 1200 --idle 150 -- docker build --pull --no-cache -t numera-browser:ci .
      - name: The container serves, authenticates and stores
        timeout-minutes: 3
        run: |
          set -euo pipefail
          token="ci-$RANDOM"
          docker run -d --name numera-ci -e NUMERA_API_TOKEN="$token" -p 18787:8787 numera-browser:ci
          ready=""
          for _ in $(seq 1 60); do
            if curl -sf --max-time 3 -H "Authorization: Bearer $token" http://127.0.0.1:18787/api/health -o "$RUNNER_TEMP/health.json"; then
              ready=1; break
            fi
            docker inspect -f '{{.State.Running}}' numera-ci | grep -q true || break
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "The container never answered /api/health"; docker logs numera-ci; exit 1
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:18787/api/health)"
          [ "$code" = "401" ] || { echo "Unauthenticated request got $code, not 401"; exit 1; }
          curl -sf --max-time 10 -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{"name":"ci-smoke"}' http://127.0.0.1:18787/api/profiles > /dev/null
          curl -sf --max-time 10 -H "Authorization: Bearer $token" http://127.0.0.1:18787/api/profiles | grep -q ci-smoke
          docker run --rm --entrypoint python numera-browser:ci -c "import cryptography, numera; print(numera.__version__, cryptography.__version__)"
      - name: The container launches its bundled Chromium
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s \
            docker run --rm --init --network none --shm-size=1g -i \
              --name "numera-browser-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --entrypoint python numera-browser:ci - \
              < scripts/smoke_container_browser.py
      - name: Remove an interrupted browser smoke container
        if: always()
        run: |
          name="numera-browser-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if docker container inspect "$name" >/dev/null 2>&1; then docker rm -f "$name"; fi
          if docker container inspect "$name" >/dev/null 2>&1; then exit 1; fi
      - name: Container logs on failure
        if: failure()
        run: |
          if docker container inspect numera-ci >/dev/null 2>&1; then docker logs numera-ci; fi
      - name: Stop the container and verify absence
        if: always()
        run: |
          if docker container inspect numera-ci >/dev/null 2>&1; then docker rm -f numera-ci; fi
          if docker container inspect numera-ci >/dev/null 2>&1; then exit 1; fi

  codeql:
    # Public repository eligibility only; private Code Security is not purchased
    # or presumed. The aggregate records this sole inapplicable check explicitly.
    if: github.event.repository.private == false
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  dependencies:
    needs: coverage
    uses: ./.github/workflows/dependency-review.yml

  distribution:
    # CodeQL eligibility is accounted for by the final aggregate, not converted
    # into a fake successful scan or a skipped private distribution.
    needs: [coverage, secrets, engine, engine-windows, engine-macos, engine-live, browser, rust-core, docker, dashboard, dependencies]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build-desktop.yml
    with:
      dashboard_artifact: dashboard-dist

  required:
    name: Required verification
    if: always()
    needs: [coverage, secrets, engine, engine-windows, engine-macos, engine-live, browser, rust-core, docker, dashboard, codeql, dependencies, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.sha }}
          DISTRIBUTION_SHA: ${{ needs.distribution.outputs.source_sha }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          failed = [name for name, job in results.items() if job["result"] != "success"
                    and not (name == "codeql" and job["result"] == "skipped"
                             and os.environ["PRIVATE_REPOSITORY"] == "true")]
          if os.environ["PRIVATE_REPOSITORY"] == "true" and results["codeql"]["result"] == "skipped":
              print("CodeQL not applicable: private repository without authorized Code Security; no scan claimed")
          if failed:
              raise SystemExit("Required verification failed: " + ", ".join(failed))
          if os.environ["DISTRIBUTION_SHA"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("Distribution source does not match the verified commit")
          print("All required verification jobs passed for " + os.environ["EXPECTED_SHA"])
          PY
