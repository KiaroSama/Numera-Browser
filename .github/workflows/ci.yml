name: CI

# Signed artifacts are prepared only for explicit owner review. Automatic
# independent unsigned builds and tests live in native-ci.yml.
on:
  workflow_dispatch:
    inputs:
      trusted_sha:
        description: Exact reviewed source SHA; must equal this run's checkout
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  NUMERA_TRUSTED_SHA: ${{ inputs.trusted_sha }}

jobs:
  coverage:
    if: github.actor == 'KiaroSama' && github.repository == 'KiaroSama/Numera-Browser' && inputs.trusted_sha == github.sha && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/migration/native-runtime-checkpoint-20261012')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - run: cargo build --manifest-path tools/xtask/Cargo.toml --locked
      - run: cargo xtask ci coverage
      - run: cargo xtask ci release plan
  dashboard:
    needs: coverage
    uses: ./.github/workflows/dashboard.yml
  desktop-contracts:
    needs: coverage
    uses: ./.github/workflows/desktop-contracts.yml
  docker:
    needs: coverage
    uses: ./.github/workflows/container.yml
  codeql:
    needs: coverage
    permissions:
      contents: read
      actions: read
      checks: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
  dependencies:
    needs: coverage
    uses: ./.github/workflows/dependency-review.yml
  distribution:
    needs: [coverage, dashboard, desktop-contracts, docker, codeql, dependencies]
    if: needs.coverage.result == 'success' && needs.desktop-contracts.result == 'success' && needs.codeql.result == 'success' && needs.dependencies.result == 'success' && needs.dashboard.result == 'success' && needs.docker.result == 'success'
    uses: ./.github/workflows/build-desktop.yml
    with:
      trusted_sha: ${{ inputs.trusted_sha }}
    secrets:
      NUMERA_RELEASE_SIGNING_KEY: ${{ secrets.NUMERA_RELEASE_SIGNING_KEY }}
      NUMERA_CODE_SIGNING_PFX: ${{ secrets.NUMERA_CODE_SIGNING_PFX }}
      NUMERA_CODE_SIGNING_PASSWORD: ${{ secrets.NUMERA_CODE_SIGNING_PASSWORD }}
  required:
    name: Required verification
    if: always()
    needs: [coverage, dashboard, desktop-contracts, docker, codeql, dependencies, distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.99.1
      - run: cargo build --manifest-path tools/xtask/Cargo.toml --locked
      - name: Require every independent prerequisite and signed build
        env:
          NUMERA_NEEDS_JSON: ${{ toJSON(needs) }}
        run: cargo xtask ci required
  attest:
    name: Attest exact reviewed source without modifying a branch
    needs: required
    if: github.event_name == 'workflow_dispatch' && github.actor == 'KiaroSama' && inputs.trusted_sha == github.sha && needs.required.result == 'success'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Retain the verified source identity in the job output
        run: test "$SOURCE_SHA" = "$TRUSTED_SHA"
        env:
          SOURCE_SHA: ${{ github.sha }}
          TRUSTED_SHA: ${{ inputs.trusted_sha }}
  review:
    needs: [required, attest]
    if: needs.required.result == 'success' && needs.attest.result == 'success'
    uses: ./.github/workflows/release.yml
    with:
      source_sha: ${{ inputs.trusted_sha }}
      run_id: ${{ github.run_id }}
