name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported, plus the current default.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        working-directory: engine
        run: pip install -e ".[api,dev]"
      - name: Compile check
        working-directory: engine
        run: python -m compileall -q numera
      - name: Unit tests
        working-directory: engine
        run: python -m pytest -q --durations=10

  browser:
    name: Live browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine with the launcher
        working-directory: engine
        run: pip install -e ".[api,launch,dev]"
      - name: Install Chromium
        working-directory: engine
        run: python -m playwright install --with-deps chromium
      # Proves the flags actually take effect in the browser - the unit tests
      # can pass while Chromium quietly ignores what we asked for. Globbed so a
      # new *_live.py cannot silently go unrun: the jobs above install no
      # browser, so these skip everywhere except here.
      - name: Browser-backed tests
        working-directory: engine
        run: python -m pytest -q tests/test_*_live.py --durations=10

  # The shell is half the product and nothing here compiled it. A Rust error
  # only showed up in the release build, which runs on a tag - by then the
  # version is cut.
  rust:
    name: Tauri shell (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Tauri's Linux backend is WebKitGTK; without these the build fails at
      # link time with missing pkg-config packages rather than anything that
      # names Tauri.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
                                  librsvg2-dev patchelf libssl-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # The shell reads the dashboard from a directory Tauri expects to exist.
      - name: Build the dashboard
        working-directory: dashboard
        run: npm ci && npm run build

      - name: Formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all --check

      - name: Lint
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        working-directory: desktop/src-tauri
        run: cargo test --all-features

  dashboard:
    name: Dashboard build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # vite 8 needs ^20.19 || >=22.12. Pinning "20" resolves to the latest
          # 20.x, which satisfies that only by a hair - 22 keeps real headroom.
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install (from the lockfile)
        working-directory: dashboard
        run: npm ci
      # The suite existed and nothing ever ran it. A build is a compile check:
      # the auth-lockout and dev-proxy regressions these tests were written for
      # could return and still reach main, because bundling them succeeds either
      # way. `npm test` is `vitest run`, which exits rather than watching.
      - name: Tests
        working-directory: dashboard
        run: npm test

      # The linter is only a gate if CI runs it.
      - name: Lint
        working-directory: dashboard
        run: npm run lint
      - name: Build
        working-directory: dashboard
        run: npm run build
