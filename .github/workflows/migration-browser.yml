name: Migration browser SDK seam

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        engine: [playwright, patchright, camoufox, cloak]
        include:
          - engine: playwright
            package: playwright==1.62.0
          - engine: patchright
            package: patchright==1.63.0
          - engine: camoufox
            package: camoufox[geoip]==0.5.7
          - engine: cloak
            package: cloakbrowser==0.5.12
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
      NUMERA_NATIVE_LIVE_ENGINE: ${{ matrix.engine }}
      CLOAKBROWSER_VERSION: "146.0.7680.177.5"
      CLOAKBROWSER_AUTO_UPDATE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install selected SDK and test owner
        run: python -m pip install -e "engine[api,dev]" "${{ matrix.package }}" "playwright==1.62.0"
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux' && matrix.engine != 'camoufox'
        run: python -m playwright install-deps chromium
      - name: Install Firefox system dependencies
        if: runner.os == 'Linux' && matrix.engine == 'camoufox'
        run: python -m playwright install-deps firefox
      - name: Install Chromium
        if: matrix.engine == 'playwright' || matrix.engine == 'patchright'
        run: python -m ${{ matrix.engine }} install chromium
      - name: Fetch Camoufox
        if: matrix.engine == 'camoufox'
        run: python -m camoufox fetch
      - name: Fetch pinned official Cloak binary
        if: matrix.engine == 'cloak'
        run: python scripts/live_engine.py prepare --engine cloak --fetch
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rust
      - name: Real SDK context and native-owned cleanup
        run: >-
          python scripts/migration/run_owned.py --wall 600 --idle 150 --
          cargo test --manifest-path engine-rust/Cargo.toml --locked
          --test browser_adapter_live -- --ignored --test-threads=1
