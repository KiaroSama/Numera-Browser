name: Migration browser SDK seam

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full SDK matrix or isolated Windows diagnosis
        type: choice
        default: all
        options: [all, windows-camoufox, windows-playwright]

permissions:
  contents: read

jobs:
  browser:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: ${{ fromJSON(inputs.scope != 'all' && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
        engine: ${{ fromJSON(inputs.scope == 'windows-camoufox' && '["camoufox"]' || inputs.scope == 'windows-playwright' && '["playwright"]' || '["playwright","patchright","camoufox","cloak"]') }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
      NUMERA_NATIVE_LIVE_ENGINE: ${{ matrix.engine }}
      SDK_PACKAGE: ${{ fromJSON('{"playwright":"playwright==1.62.0","patchright":"patchright==1.63.0","camoufox":"camoufox[geoip]==0.5.7","cloak":"cloakbrowser==0.5.12"}')[matrix.engine] }}
      CLOAKBROWSER_VERSION: "146.0.7680.177.5"
      CLOAKBROWSER_AUTO_UPDATE: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.15"
      - name: Install selected SDK and test owner
        run: python -m pip install -e "engine[api,dev]" "${{ env.SDK_PACKAGE }}" "playwright==1.62.0"
      - name: Install Chromium system dependencies
        if: runner.os == 'Linux' && matrix.engine != 'camoufox'
        run: python -m playwright install-deps chromium
      - name: Install Firefox system dependencies
        if: runner.os == 'Linux' && matrix.engine == 'camoufox'
        run: python -m playwright install-deps firefox
      - name: Install Chromium
        if: matrix.engine == 'playwright' || matrix.engine == 'patchright'
        run: python -m ${{ matrix.engine }} install chromium
      - name: Fetch Camoufox
        if: matrix.engine == 'camoufox'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- python -m camoufox fetch
      - name: Verify Camoufox binary prerequisite
        if: matrix.engine == 'camoufox'
        run: python scripts/migration/run_owned.py --wall 60 --idle 30 -- python scripts/live_engine.py prepare --engine camoufox
      - name: Fetch pinned official Cloak binary
        if: matrix.engine == 'cloak'
        run: python scripts/migration/run_owned.py --wall 300 --idle 120 -- python scripts/live_engine.py prepare --engine cloak --fetch --export-native
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rust
      - name: Real SDK context and native-owned cleanup
        run: >-
          python scripts/migration/run_owned.py --wall 600 --idle 150 --
          cargo test --manifest-path engine-rust/Cargo.toml --locked
          --test browser_adapter_live -- --ignored --test-threads=1 --nocapture
