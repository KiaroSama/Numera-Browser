name: Native SDK and relocated application acceptance
description: Retain library SDK coverage and exercise the opt-in native binary outside checkout ancestry.
inputs:
  engine:
    description: Existing verified browser backend for this matrix leg.
    required: true
runs:
  using: composite
  steps:
    - name: Required native SDK context and cleanup
      shell: bash
      run: >-
        python scripts/migration/run_owned.py --wall 600 --idle 150 --
        cargo test --manifest-path engine-rust/Cargo.toml --locked
        --test browser_adapter_live -- --ignored --test-threads=1 --nocapture
    - name: Use the dashboard from this exact verification batch
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dashboard-dist
        path: build/native-candidate/dashboard
    - name: Verify dashboard source identity
      shell: bash
      run: |
        python -I -c 'import json,os,pathlib; p=pathlib.Path("build/native-candidate/dashboard/ci-source.json"); assert json.loads(p.read_text(encoding="utf-8"))["source_sha"]==os.environ["GITHUB_SHA"]'
    - name: Build the explicit candidate and capture its current Cargo artifact
      shell: bash
      run: >-
        python scripts/migration/run_owned.py --wall 960 --idle 330 --
        python scripts/migration/candidate_stage.py --report build/native-candidate/cargo.jsonl
    - name: Real relocated application CLI MCP HTTP and browser lifecycle
      shell: bash
      env:
        CANDIDATE_ENGINE: ${{ inputs.engine }}
      run: >-
        python scripts/migration/run_owned.py --wall 600 --idle 150 --report-units --
        python scripts/migration/candidate_acceptance.py --report build/native-candidate/cargo.jsonl
        --dashboard build/native-candidate/dashboard --engine "$CANDIDATE_ENGINE"
