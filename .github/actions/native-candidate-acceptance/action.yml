name: Native SDK and relocated application acceptance
description: Compare the reviewed native checkpoint and native product using one explicitly provisioned Rust SDK.
inputs:
  engine:
    description: Existing verified browser backend for this matrix leg.
    required: true
runs:
  using: composite
  steps:
    - name: Required native SDK context and cleanup
      shell: bash
      run: cargo xtask ci counted-tests 1 build/selected-sdk.log -- cargo test --manifest-path engine-rust/Cargo.toml --locked --features native-product,native-browser,test-support --test browser_adapter_live -- --ignored --exact selected_sdk_opens_real_persistent_context_in_native_owned_tree --test-threads=1 --color=never
    - name: Use the dashboard from this exact verification batch
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: dashboard-dist
        path: dashboard/dist
    - name: Require the Rust dashboard from the exact current source
      shell: bash
      run: cargo xtask ci dashboard-identity dashboard/dist
    - name: Build the optimized explicit candidate and retain exact compiler identity
      shell: bash
      run: |
        cargo xtask ci owned --wall 960 --idle 330 -- cargo xtask build-candidate build/native-candidate --release
        cargo xtask ci owned --wall 960 --idle 330 -- cargo xtask ci product-compile
        cargo xtask ci owned --wall 120 --idle 60 -- cargo xtask ci reference-prepare "$RUNNER_TEMP/numera-native-checkpoint" "$NUMERA_BROWSER_RUNTIME"
        cargo xtask ci owned --wall 960 --idle 330 -- cargo xtask ci reference-build "$RUNNER_TEMP/numera-native-checkpoint" "$RUNNER_TEMP/numera-native-checkpoint.receipt.json"
    - name: Real relocated application CLI MCP HTTP and browser lifecycle
      shell: bash
      run: cargo xtask ci owned --wall 600 --idle 150 -- cargo xtask ci acceptance "$NUMERA_NATIVE_ENGINE" "$RUNNER_TEMP/native-application-acceptance"
    - name: Require all five native entry workloads on both ownership platforms
      if: inputs.engine == 'playwright'
      shell: bash
      run: cargo xtask ci owned --wall 180 --idle 90 -- cargo xtask ci entry-benchmark "$RUNNER_TEMP/numera-native-checkpoint.target/release/numera-native-candidate${{ runner.os == 'Windows' && '.exe' || '' }}" "$NUMERA_NATIVE_ENGINE" "$NUMERA_BROWSER_RUNTIME" build/native-candidate/entry-performance.json
    - name: Real browser performance against the immutable native checkpoint
      shell: bash
      env:
        CANDIDATE_ENGINE: ${{ inputs.engine }}
      run: cargo xtask ci owned --wall 600 --idle 150 -- cargo xtask ci browser-benchmark "$RUNNER_TEMP/numera-native-checkpoint.target/release/numera-native-candidate${{ runner.os == 'Windows' && '.exe' || '' }}" "$NUMERA_NATIVE_ENGINE" "$NUMERA_BROWSER_RUNTIME" build/native-candidate/browser-performance.json "$CANDIDATE_ENGINE"
    - name: Preserve exact-source browser measurement and checkpoint bridge evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: browser-performance-${{ runner.os }}-${{ inputs.engine }}-${{ github.sha }}
        path: |
          build/native-candidate/browser-performance.json
          build/native-candidate/entry-performance.json
          ${{ runner.temp }}/numera-native-checkpoint.receipt.json
        if-no-files-found: error
        retention-days: 7
