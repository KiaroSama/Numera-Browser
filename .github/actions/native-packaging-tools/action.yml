name: Install native packaging tools
description: Install the checksum-pinned upstream Rust tools for Linux, Windows and macOS ARM64.
runs:
  using: composite
  steps:
    - name: Verify and install release tooling
      shell: bash
      run: |
        set -euo pipefail
        log() {
          case "$1" in INFO|WARNING|ERROR|DEBUG) ;; *) return 2 ;; esac
          printf '%s [%s] %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$1" "$2"
        }
        trap 'log ERROR "Native packaging tool installation failed"' ERR
        log INFO "Installing checksum-pinned native packaging tools"
        directory="$RUNNER_TEMP/numera-packaging-tools"
        mkdir -p "$directory/bin"

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            tauri_archive=cargo-tauri-x86_64-unknown-linux-gnu.tgz
            tauri_sha=79f9596308f74e41753d1d30688a3f41914187b1bc7eea5dbd20cc0cd6acd640
            bindgen_target=x86_64-unknown-linux-musl
            bindgen_sha=82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
            suffix=
            ;;
          Linux/ARM64)
            tauri_archive=cargo-tauri-aarch64-unknown-linux-gnu.tgz
            tauri_sha=1dacce76a0358e5180791007535cb199e4212ff0cff9b88f5d6070cb91066c12
            bindgen_target=aarch64-unknown-linux-musl
            bindgen_sha=2ed4351c35dd9440308bbb02767d47ea278efe851a52465300f3c94f5b6c2a87
            suffix=
            ;;
          Windows/X64|Windows/ARM64)
            tauri_archive=cargo-tauri-x86_64-pc-windows-msvc.zip
            tauri_sha=ff7bb69eb0e102eb84825fd7e3e73a6ee9ca23826c405c781ee727081472246d
            if [[ "$RUNNER_ARCH" == ARM64 ]]; then
              tauri_archive=cargo-tauri-aarch64-pc-windows-msvc.zip
              tauri_sha=5c77e018ca82a570bcc1909244325495e678bcc19e0052ce59420de965ec46a6
            fi
            # wasm-bindgen v0.2.129 ships only the x64 Windows CLI; it runs under emulation.
            bindgen_target=x86_64-pc-windows-msvc
            bindgen_sha=79e348c169d0c10c0b287647f1e753d0985353ca96800bc29be8f4261baf13e6
            suffix=.exe
            ;;
          macOS/ARM64)
            tauri_archive=cargo-tauri-aarch64-apple-darwin.zip
            tauri_sha=bae2db07d3962d096acdb758b0e35f93e3e6b6db5443cea370b2718a907a5216
            bindgen_target=aarch64-apple-darwin
            bindgen_sha=81d4a23d56b3c3eb8187658329116d50e0b228a93b343825fb71f70179051cd1
            suffix=
            ;;
          *) exit 1 ;;
        esac
        bindgen_directory="wasm-bindgen-0.2.129-$bindgen_target"
        bindgen_archive="$bindgen_directory.tar.gz"

        cd "$directory"
        download() {
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 90 --retry 2 --retry-max-time 120 \
            "$1/$2" --output "$2"
          if [[ "$RUNNER_OS" == macOS ]]; then
            printf '%s  %s\n' "$3" "$2" | shasum --algorithm 256 --check --strict
          else
            printf '%s  %s\n' "$3" "$2" | sha256sum --check --strict
          fi
          log DEBUG "Verified the downloaded tool archive checksum"
        }
        download 'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.5' "$tauri_archive" "$tauri_sha"
        download 'https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129' "$bindgen_archive" "$bindgen_sha"

        if [[ "$RUNNER_OS" == Windows ]]; then
          7z x -so "$tauri_archive" cargo-tauri.exe > bin/cargo-tauri.exe
        elif [[ "$RUNNER_OS" == macOS ]]; then
          unzip -p "$tauri_archive" cargo-tauri > bin/cargo-tauri
          chmod 755 bin/cargo-tauri
        else
          tar -xzf "$tauri_archive" -C bin cargo-tauri
        fi
        tar -xzf "$bindgen_archive" -C bin --strip-components=1 "$bindgen_directory/wasm-bindgen$suffix"
        test "$(bin/cargo-tauri"$suffix" tauri --version)" = 'tauri-cli 2.12.5'
        test "$(bin/wasm-bindgen"$suffix" --version)" = 'wasm-bindgen 0.2.129'
        printf '%s\n' "$directory/bin" >> "$GITHUB_PATH"
        log INFO "Verified native packaging tool versions and installed them"
