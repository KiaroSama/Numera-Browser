name: Native source module checkpoints
description: Preserve complete native test verdicts after proving cleanup and uploading immutable state.
inputs:
  shard:
    required: true
    description: Zero based source partition
  shards:
    required: true
    default: '4'
    description: Source partition count
  output:
    required: true
    description: Checkpoint directory
outputs:
  settled:
    description: All nine module slots and uploads settled
    value: ${{ steps.module_8.outputs.settled == 'true' && steps.checkpoint_8.outcome == 'success' }}
runs:
  using: composite
  steps:
    - id: module_0
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        cargo xtask ci owned --wall 600 --idle 120 -- cargo xtask ci source-checkpoint ${{ inputs.shard }} ${{ inputs.shards }} 2 4 0 '${{ inputs.output }}'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cargo xtask ci owned --wall 30 --idle 15 -- cargo xtask ci settled-index '${{ inputs.output }}/checkpoint.json' 0
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $state = Get-Content '${{ inputs.output }}/checkpoint.json' -Raw | ConvertFrom-Json
        $testExit = $state.slot_results[0]
        "settled=true" >> $env:GITHUB_OUTPUT
        exit [int]$testExit
    - id: checkpoint_0
      if: ${{ !cancelled() && steps.module_0.outputs.settled == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: source-windows-checkpoint-2-module-0
        path: ${{ inputs.output }}
        if-no-files-found: error
    - id: module_1
      if: ${{ !cancelled() && steps.module_0.outputs.settled == 'true' && steps.checkpoint_0.outcome == 'success' }}
      shell: pwsh
      run: |
        cargo xtask ci owned --wall 600 --idle 120 -- cargo xtask ci source-checkpoint ${{ inputs.shard }} ${{ inputs.shards }} 2 4 1 '${{ inputs.output }}'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        cargo xtask ci owned --wall 30 --idle 15 -- cargo xtask ci settled-index '${{ inputs.output }}/checkpoint.json' 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $state = Get-Content '${{ inputs.output }}/checkpoint.json' -Raw | ConvertFrom-Json
        $testExit = $state.slot_results[1]
        "settled=true" >> $env:GITHUB_OUTPUT
        exit [int]$testExit
    - id: checkpoint_1
      if: ${{ !cancelled() && steps.module_1.outputs.settled == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: source-windows-checkpoint-2-module-1
        path: ${{ inputs.output }}
        if-no-files-found: error
    - id: module_2
      if: ${{ !cancelled() && steps.module_1.outputs.settled == 'true' && steps.checkpoint_1.outcome == 'success' }}
