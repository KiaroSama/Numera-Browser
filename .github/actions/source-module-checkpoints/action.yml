name: Preserve Windows source module checkpoints
description: Run the nine problem-block modules once and retain each settled result before starting the next.
outputs:
  settled:
    description: Every module owner settled and the final checkpoint upload succeeded.
    value: ${{ steps.module_8.outputs.settled == 'true' && steps.checkpoint_8.outcome == 'success' }}
runs:
  using: composite
  steps:
    - name: Source module 0
      id: module_0
      if: ${{ !cancelled() }}
      shell: pwsh
      run: |
        python scripts/migration/run_owned.py --wall 600 --idle 120 -- python scripts/ci/python_source.py --shard 1 --shards 4 --block 2 --blocks 4 --module-index 0
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python scripts/migration/run_owned.py --wall 30 --idle 15 -- python scripts/ci/python_source.py --settled-index 0
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $state = Get-Content -LiteralPath build/source-windows-1/checkpoint.json -Raw -Encoding utf8 | ConvertFrom-Json
        $testExit = $state.module_results[0].exit
        if ($testExit -notin @(0, 1)) { throw 'Source module verdict is invalid' }
        'settled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        exit [int]$testExit
    - name: Preserve source module 0
      id: checkpoint_0
      if: ${{ (success() || failure()) && !cancelled() && steps.module_0.outputs.settled == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: source-windows-checkpoint-2-module-0
        path: build/source-windows-1/
        if-no-files-found: error
        retention-days: 7
    - name: Source module 1
      id: module_1
      if: ${{ (success() || failure()) && !cancelled() && steps.module_0.outputs.settled == 'true' && steps.checkpoint_0.outcome == 'success' }}
      shell: pwsh
      run: |
        python scripts/migration/run_owned.py --wall 600 --idle 120 -- python scripts/ci/python_source.py --shard 1 --shards 4 --block 2 --blocks 4 --module-index 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python scripts/migration/run_owned.py --wall 30 --idle 15 -- python scripts/ci/python_source.py --settled-index 1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $state = Get-Content -LiteralPath build/source-windows-1/checkpoint.json -Raw -Encoding utf8 | ConvertFrom-Json
        $testExit = $state.module_results[1].exit
        if ($testExit -notin @(0, 1)) { throw 'Source module verdict is invalid' }
        'settled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        exit [int]$testExit
