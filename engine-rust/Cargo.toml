[package]
name = "numera-core"
version = "0.36.0"
edition = "2024"
rust-version = "1.99"
description = "Parity-gated Numera Browser application core"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json"] }
tokio = { version = "1.53.2", features = ["rt", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.0"
subtle = "2.6.1"
getrandom = "0.4.3"
base64 = "0.23.1"
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Diagnostics_ToolHelp", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[lints.clippy]
unwrap_used = "deny"

[lints.rust]
unsafe_code = "deny"
