[package]
name = "numera-core"
version = "0.36.0"
edition = "2024"
rust-version = "1.99"
description = "Parity-gated Numera Browser application core"
license-file = "../LICENSE"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "http1", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["string"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
tokio = { version = "1.53.2", features = ["rt", "time", "net", "io-util", "sync", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"
subtle = "2.6.1"
getrandom = "0.4.3"
base64 = "0.23.1"
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Wdk_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[lints.clippy]
unwrap_used = "deny"

[lints.rust]
unsafe_code = "deny"
