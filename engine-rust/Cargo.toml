[package]
name = "numera-core"
version = "0.36.0"
edition = "2024"
rust-version = "1.99"
description = "Parity-gated Numera Browser application core"
license-file = "../LICENSE"
publish = false
default-run = "numera-engine"
autobins = false
autoexamples = false

[features]
default = ["native-product", "native-browser"]
native-candidate = []
native-product = []
test-support = []
native-browser = ["dep:playwright-rs", "dep:ruzstd", "dep:maxminddb", "dep:serde_yaml"]

[[bin]]
name = "numera-native-candidate"
path = "examples/native_candidate.rs"
required-features = ["native-candidate"]
test = false
bench = false

[[bin]]
name = "numera-engine"
path = "src/bin/engine.rs"
required-features = ["native-product"]
test = false
bench = false

[[bin]]
name = "numera-http-observer"
path = "src/bin/http_observer.rs"
required-features = ["native-product"]
test = false
bench = false

[[bin]]
name = "numera-browser-runtime"
path = "src/bin/browser_runtime.rs"
required-features = ["native-browser"]
test = false
bench = false

[[test]]
name = "browser_adapter_protocol"
path = "tests/browser_adapter_protocol.rs"
required-features = ["native-browser", "test-support"]

[[test]]
name = "source_browser"
path = "tests/source_browser.rs"
required-features = ["test-support", "native-product", "native-browser"]

[[test]]
name = "source_network"
path = "tests/source_network.rs"
required-features = ["test-support"]

[[test]]
name = "source_storage"
path = "tests/source_storage.rs"
required-features = ["test-support", "native-product"]

[[test]]
name = "source_acceptance"
path = "tests/source_acceptance.rs"
required-features = ["test-support", "native-product"]

[[test]]
name = "source_http"
path = "tests/source_http.rs"
required-features = ["test-support", "native-product"]

[[test]]
name = "source_contracts"
path = "tests/source_contracts.rs"
required-features = ["test-support"]

[[test]]
name = "source_vault"
path = "tests/source_vault.rs"
required-features = ["test-support"]

[[test]]
name = "source_ownership"
path = "tests/source_ownership.rs"
required-features = ["test-support"]

[[test]]
name = "profile_read_parity"
path = "tests/profile_read_parity.rs"
required-features = ["test-support"]

[[test]]
name = "source_performance"
path = "tests/source_performance.rs"
required-features = ["test-support", "native-product"]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json", "http1", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["string"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
tokio = { version = "1.53.2", features = ["rt", "time", "net", "io-util", "sync", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
percent-encoding = "2.3.2"
regex = "=1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "socks"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
quick-xml = "=0.38.4"
sha2 = "0.11.1"
subtle = "2.6.1"
getrandom = "0.4.3"
base64 = "0.23.1"
pbkdf2 = { version = "0.13.0", features = ["sha2"] }
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
playwright-rs = { version = "=0.20.1", default-features = false, features = ["aws-lc"], optional = true }
ruzstd = { version = "=0.9.1", optional = true }
maxminddb = { version = "0.27", optional = true }
serde_yaml = { version = "0.9.34", optional = true }
num-bigint = "0.4"
ed25519-dalek = "3.0.0"
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"

[dev-dependencies]
numera-dashboard = { path = "../dashboard" }
socket2 = "=0.6.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Wdk_Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

# PBKDF2's generic loop is instantiated here; SHA compression is in sha2.
# Test inherits dev, including its debug assertions and overflow checks.
[profile.dev.package.numera-core]
opt-level = 1

[profile.dev.package."sha2:0.11.1"]
opt-level = 1

[lints.clippy]
unwrap_used = "deny"

[lints.rust]
unsafe_code = "deny"
