[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "numera-engine"
version = "0.3.0"
description = "Coherent browser fingerprint & profile engine for Numera."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "KiaroSama" }]
keywords = [
    "browser", "fingerprint", "profile-manager", "anti-detect",
    "multi-account", "privacy", "automation", "playwright",
    "camoufox", "cloakbrowser", "patchright",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KiaroSama/Numera"
Source = "https://github.com/KiaroSama/Numera"
Issues = "https://github.com/KiaroSama/Numera/issues"

[project.optional-dependencies]
launch = ["playwright>=1.40"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
secure = ["cryptography>=42.0"]
dev = ["pytest>=7.0", "cryptography>=42.0", "httpx>=0.27"]

[project.scripts]
numera = "numera.cli:main"

[tool.setuptools.packages.find]
include = ["numera*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
