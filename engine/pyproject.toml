[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "numera-engine"
version = "0.17.1"
description = "Coherent browser fingerprint & profile engine for Numera Browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "KiaroSama" }]
keywords = [
    "browser", "fingerprint", "profile-manager", "anti-detect",
    "multi-account", "privacy", "automation", "playwright",
    "camoufox", "cloakbrowser", "patchright",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KiaroSama/Numera-Browser"
Source = "https://github.com/KiaroSama/Numera-Browser"
Issues = "https://github.com/KiaroSama/Numera-Browser/issues"

[project.optional-dependencies]
launch = ["playwright>=1.40"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
secure = ["cryptography>=42.0"]
dev = ["pytest>=7.0", "cryptography>=42.0", "httpx>=0.27"]

[project.scripts]
numera = "numera.cli:main"

[tool.setuptools.packages.find]
include = ["numera*"]

# The built dashboard ships inside the package, because `numera serve` serves it
# from `numera/web`. Without this, setuptools packages only the .py files and the
# server wheel installs with no interface at all - which looks like a working
# install right up until someone opens the port.
[tool.setuptools.package-data]
numera = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The whole workflow hangs off one marker: offline runs use `-m "not slow"` and
# the live suite uses `-m slow`. Unregistered, pytest warned on every run and -
# worse - accepted a typo like `slwo` as a brand new marker, which would sort a
# live browser test into the offline suite with nothing to say so.
markers = ["slow: needs a real browser; excluded from the offline run"]
addopts = "--strict-markers"
