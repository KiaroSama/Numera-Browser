[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numera-engine"
version = "0.36.0"
description = "Coherent browser fingerprint & profile engine for Numera Browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LicenseRef-Proprietary" }
authors = [{ name = "KiaroSama" }]
keywords = [
    "browser", "fingerprint", "profile-manager", "anti-detect",
    "multi-account", "privacy", "automation", "playwright",
    "camoufox", "cloakbrowser", "patchright",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KiaroSama/Numera-Browser"
Source = "https://github.com/KiaroSama/Numera-Browser"
Issues = "https://github.com/KiaroSama/Numera-Browser/issues"

[project.optional-dependencies]
launch = ["playwright>=1.62.0"]
api = ["fastapi>=0.142.2", "uvicorn>=0.54.0"]
secure = ["cryptography>=50.0.2"]
# Camoufox currently requires the shared Playwright client below 1.63.
desktop = ["playwright>=1.62.0,<1.65", "patchright>=1.63.0", "camoufox[geoip]>=0.5.7", "cloakbrowser[geoip]>=0.5.12"]
dev = ["pytest>=9.1.1", "pytest-timeout>=2.4.0", "cryptography>=50.0.2", "httpx>=0.28.1"]

[project.scripts]
numera = "numera.cli:main"

[tool.setuptools.packages.find]
include = ["numera*"]

# The built dashboard ships inside the package, because `numera serve` serves it
# from `numera/web`. Without this, setuptools packages only the .py files and the
# server wheel installs with no interface at all - which looks like a working
# install right up until someone opens the port.
[tool.setuptools.package-data]
numera = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The whole workflow hangs off one marker: offline runs use `-m "not slow"` and
# the live suite uses `-m slow`. Unregistered, pytest warned on every run and -
# worse - accepted a typo like `slwo` as a brand new marker, which would sort a
# live browser test into the offline suite with nothing to say so.
markers = ["slow: needs a real browser; excluded from the offline run"]

# A per-test ceiling, so a hang fails as a named test with a traceback instead
# of running out the CI job's clock. This is not hypothetical: the py3.12 job
# reached 57% and then went silent for fourteen minutes until the 15-minute job
# ceiling killed it, leaving an orphaned python process behind. The run was
# reported as "cancelled", which reads like an infrastructure blip rather than
# the defect it was. The whole suite takes about a minute on a runner, so 120s
# for a single test is far above anything healthy and only fires on a real stall.
#
# `thread` method, not `signal`: the signal method only interrupts the main
# thread, and the tests that are most likely to hang here are the ones running
# a relay or a server on a worker thread.
timeout = 120
timeout_method = "thread"
addopts = "--strict-markers"

# A leaked handle is a failed run, not a note at the bottom of one. This suite
# spawns browsers, drivers, relays and servers, and "no leaked process, port or
# handle" is already a requirement the guarded runner checks structurally - but
# an unclosed socket or pipe inside the test process is invisible to it, and a
# ResourceWarning that is merely printed is a signal nobody reads. Measured
# before it was turned on: the suite passes with it, so nothing here is being
# suppressed to make it green.
#
# It only bites while pytest's warnings plugin is loaded, so do NOT add
# `-p no:warnings` to a run whose result is meant to prove anything.
filterwarnings = [
    "error::ResourceWarning",
    # `error::ResourceWarning` alone never failed a run, and the CI logs of a
    # *passing* job proved it: they carry unclosed `BufferedReader`s and
    # still-running subprocesses, every one of them wrapped.
    #
    # The wrapping is why. A `ResourceWarning` raised during garbage collection
    # or inside a thread cannot propagate to the test that caused it - there is
    # no frame left to raise into - so pytest catches it and re-emits it as one
    # of these instead. The original filter then does not match, because the
    # warning reaching the filter is no longer a `ResourceWarning`.
    #
    # Gating the wrappers is what makes the first line mean what it says.
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    # Deliberate, and the tests that provoke it assert on the behaviour behind
    # it - see `store._reconciled`.
    "ignore:the two stored copies of profile:RuntimeWarning",
    # Starlette's own notice about its httpx dependency; not this project's.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
