[package]
name = "numera-desktop"
version = "0.36.0"
edition = "2021"
rust-version = "1.90"
description = "Numera Browser desktop shell"
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "numera"
path = "src/main.rs"

[features]
default = []
update-acceptance = []

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
getrandom = "0.4.3"
tokio = { version = "1.53.2", features = ["rt", "time", "macros"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = { version = "0.4.46", default-features = false }
flate2 = "1.1.10"

# Already in the tree via tauri; used only for the job object that stops the
# engine outliving a force-killed shell.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading", # gates the limit structs
    "Win32_Security",         # gates CreateJobObjectW (SECURITY_ATTRIBUTES)
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
] }

# Linux only: PR_SET_PDEATHSIG, so a force-killed shell takes the engine with
# it the way the job object already does on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
