[package]
name = "numera-desktop"
version = "0.17.1"
edition = "2021"
rust-version = "1.77"
description = "Numera Browser desktop shell"
publish = false

[[bin]]
name = "numera"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

# Already in the tree via tauri; used only for the job object that stops the
# engine outliving a force-killed shell.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading", # gates the limit structs
    "Win32_Security",         # gates CreateJobObjectW (SECURITY_ATTRIBUTES)
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
