[package]
name = "numera-desktop"
version = "0.36.0"
edition = "2021"
rust-version = "1.90"
description = "Numera Browser desktop shell"
license-file = "../../LICENSE"
publish = false

[[bin]]
name = "numera"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
serde_json = "1"

# Already in the tree via tauri; used only for the job object that stops the
# engine outliving a force-killed shell.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading", # gates the limit structs
    "Win32_Security",         # gates CreateJobObjectW (SECURITY_ATTRIBUTES)
] }

# Linux only: PR_SET_PDEATHSIG, so a force-killed shell takes the engine with
# it the way the job object already does on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
